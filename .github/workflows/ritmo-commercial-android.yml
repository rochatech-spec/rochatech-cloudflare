name: Ritmo Commercial • Android APK

on:
  push:
    branches: [ritmo-commercial-bootstrap, main, ritmo-functional-hotfix-20260910, ritmo-finalize-20260910]
    paths:
      - ".github/workflows/ritmo-commercial-android.yml"
      - "ritmo-commercial/src/**"
      - "ritmo-commercial/src-tauri/**"
      - "ritmo-commercial/public/**"
      - "ritmo-commercial/scripts/**"
      - "ritmo-commercial/package.json"
      - "ritmo-commercial/vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Tauri 2 Android + APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ritmo-commercial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Preparar Rust e Android
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar Web, Worker e Tauri
        env:
          VITE_API_URL: https://ritmo-commercial.pages.dev/api
        run: |
          set -euo pipefail
          npm run check
          npm run build
      - name: Inicializar Android Tauri
        env:
          CI: "true"
        run: |
          set -euo pipefail
          rm -rf src-tauri/gen/android
          npm run tauri android init -- --ci
          npm run tauri icon public/pwa-512.png
          python - <<'PY'
          from pathlib import Path
          p=Path("src-tauri/gen/android/app/build.gradle.kts")
          s=p.read_text()
          needle='getByName("release") {'
          if needle not in s:
              raise SystemExit("buildType release não encontrado")
          s=s.replace(needle, needle+'\n            signingConfig = signingConfigs.getByName("debug")', 1)
          p.write_text(s)
          PY
          test -s src-tauri/gen/android/gradlew
      - name: Compilar APK release otimizado
        env:
          VITE_API_URL: https://ritmo-commercial.pages.dev/api
          CI: "true"
        run: |
          set -euo pipefail
          npm run tauri android build -- --apk --target aarch64 --target armv7
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | grep -E 'release' | head -1)"
          test -n "$APK"
          test -s "$APK"
          cp "$APK" Ritmo-Android.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs Ritmo-Android.apk
          sha256sum Ritmo-Android.apk | tee Ritmo-Android.apk.sha256
          SIZE="$(stat -c%s Ritmo-Android.apk)"
          test "$SIZE" -gt 1000000
          test "$SIZE" -lt 250000000
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Ritmo-Android-APK-Tauri
          path: |
            ritmo-commercial/Ritmo-Android.apk
            ritmo-commercial/Ritmo-Android.apk.sha256
          if-no-files-found: error
          retention-days: 30
