name: Ritmo production v4 auth fix

# refresh auth request 2026-09-06
on:
  push:
    branches: [main]
    paths:
      - "ritmo-worker/**"
      - ".github/workflows/ritmo-production-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ritmo-production-v4
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restaurar projeto e aplicar auth fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ritmo-build
          mkdir -p ritmo-build
          cat ritmo-bundle/part-* > /tmp/ritmo.b64
          echo "6067974a8de59e1bbe64c2fc21f16a10595deca264544a24a0816d09fdb73640  /tmp/ritmo.b64" | sha256sum -c -
          base64 -d /tmp/ritmo.b64 > /tmp/ritmo.tgz
          echo "98be91a5a1aef22682cab9a73fc56df06bc0d13887c05deadb532799a0619c3a  /tmp/ritmo.tgz" | sha256sum -c -
          tar -xzf /tmp/ritmo.tgz -C ritmo-build
          cat ritmo-worker/part-* > /tmp/worker.b64
          echo "58596dfd23efa98f9c6bd80a938a80c0cca18826693b3741bd671634e10eedcb  /tmp/worker.b64" | sha256sum -c -
          base64 -d /tmp/worker.b64 > ritmo-build/_worker.js
          echo "1a9d8fee34a5b12b951c5d381313344873cd6fda61866c33fa2caa4b07a3eb8a  ritmo-build/_worker.js" | sha256sum -c -
          grep -Fq 'scrypt$16384' ritmo-build/_worker.js

      - name: Instalar e buildar
        working-directory: ritmo-build
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s dist/_worker.js
          grep -Fq 'scrypt$16384' dist/_worker.js

      - name: Iniciar autorização Cloudflare
        id: cfauth
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/ritmo-build/cloudflare-device-login.txt"
          PID="$GITHUB_WORKSPACE/ritmo-build/cloudflare-device-login.pid"
          rm -f "$LOG" "$PID"
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mode=device" >> "$GITHUB_OUTPUT"
          (
            unset RUNNER_TRACKING_ID
            nohup npx --yes wrangler@latest login --device --browser=false > "$LOG" 2>&1 &
            echo $! > "$PID"
          )
          for i in {1..45}; do
            if grep -q 'dash.cloudflare.com/oauth2/device' "$LOG"; then
              cat "$LOG"
              exit 0
            fi
            sleep 1
          done
          cat "$LOG"
          exit 1

      - name: Disponibilizar autorização
        if: steps.cfauth.outputs.mode == 'device'
        uses: actions/upload-artifact@v4
        with:
          name: ritmo-cloudflare-authorization-v4
          path: ritmo-build/cloudflare-device-login.txt
          retention-days: 1

      - name: Aguardar autorização
        if: steps.cfauth.outputs.mode == 'device'
        shell: bash
        run: |
          set -euo pipefail
          PID="$GITHUB_WORKSPACE/ritmo-build/cloudflare-device-login.pid"
          P="$(cat "$PID")"
          for i in {1..300}; do
            if npx --yes wrangler@latest whoami --json >/tmp/whoami.json 2>/dev/null; then exit 0; fi
            if ! kill -0 "$P" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          exit 1

      - name: Descobrir conta
        id: account
        shell: bash
        run: |
          npx --yes wrangler@latest whoami --json > /tmp/whoami.json
          ACCOUNT_ID="$(node -e "const d=require('/tmp/whoami.json');const a=d.accounts?.[0];if(!a?.id)process.exit(2);process.stdout.write(a.id)")"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Configurar D1
        working-directory: ritmo-build
        shell: bash
        run: |
          cat > wrangler.toml <<'EOF'
          name = "ritmo"
          compatibility_date = "2026-09-05"
          pages_build_output_dir = "./dist"

          [[d1_databases]]
          binding = "DB"
          database_name = "ritmo-db"
          database_id = "17baeadd-2140-4cf6-ad5b-0aa0390d1d16"

          [vars]
          APP_NAME = "Ritmo"
          APP_URL = "https://ritmo-96q.pages.dev"
          EOF

      - name: Aplicar schema
        working-directory: ritmo-build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: npx --yes wrangler@latest d1 execute ritmo-db --remote --file ./schema.sql

      - name: Publicar
        working-directory: ritmo-build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: npx --yes wrangler@latest pages deploy dist --project-name ritmo --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true

      - name: Validar produção
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ritmo-96q.pages.dev"
          for i in {1..36}; do
            CODE="$(curl -sS -o /tmp/health.json -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/api/health?build=$GITHUB_SHA" || true)"
            if [ "$CODE" = "200" ] && grep -q '"ok":true' /tmp/health.json && grep -q '"db":true' /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          cat /tmp/health.json || true
          exit 1
