name: Ritmo V1 package

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ritmo-v6-package.yml"
      - ".github/scripts/ritmo_v7_ux_patch.py"
      - ".github/scripts/ritmo_v1_update_patch.py"
      - ".github/scripts/ritmo_v1_device_security_ux.py"
      - ".github/scripts/ritmo_v1_brand_menu_patch.py"
      - ".github/scripts/ritmo_v1_sharing_patch.py"
      - ".github/scripts/ritmo_v1_fix_sharing_runner.py"
      - ".github/scripts/ritmo_v1_ios_organization_patch.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ritmo-v1-package
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restaurar base atual
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ritmo-v1
          mkdir -p /tmp/ritmo-v1
          cat ritmo-v5/part-* > /tmp/ritmo-base.b64
          base64 -d /tmp/ritmo-base.b64 > /tmp/ritmo-base.tgz
          tar -xzf /tmp/ritmo-base.tgz -C /tmp/ritmo-v1

      - name: Aplicar backend cloud-first
        run: python3 .github/scripts/ritmo_v6_backend.py /tmp/ritmo-v1

      - name: Aplicar UI, filtros e economia
        run: python3 .github/scripts/ritmo_v6_ui.py /tmp/ritmo-v1

      - name: Aplicar refinamentos da V1
        run: python3 .github/scripts/ritmo_v7_ux_patch.py /tmp/ritmo-v1

      - name: Aplicar atualização limpa do sistema
        run: python3 .github/scripts/ritmo_v1_update_patch.py /tmp/ritmo-v1

      - name: Aplicar segurança por dispositivo
        run: python3 .github/scripts/ritmo_v1_device_security_ux.py /tmp/ritmo-v1

      - name: Aplicar identidade oficial e Menu
        run: python3 .github/scripts/ritmo_v1_brand_menu_patch.py /tmp/ritmo-v1

      - name: Corrigir executor do Compartilhamento
        run: python3 .github/scripts/ritmo_v1_fix_sharing_runner.py

      - name: Aplicar Compartilhamento a dois
        run: python3 .github/scripts/ritmo_v1_sharing_patch.py /tmp/ritmo-v1

      - name: Aplicar organização iOS e perfil
        run: python3 .github/scripts/ritmo_v1_ios_organization_patch.py /tmp/ritmo-v1

      - name: Validar sintaxe e regras Rocha Tech
        shell: bash
        run: |
          set -euo pipefail
          node --check /tmp/ritmo-v1/public/app.js
          node --check /tmp/ritmo-v1/_worker.js
          node --check /tmp/ritmo-v1/public/sw.js
          grep -Fq "Últimos 7 dias" /tmp/ritmo-v1/public/app.js
          grep -Fq "Últimos 15 dias" /tmp/ritmo-v1/public/app.js
          grep -Fq "Últimos 30 dias" /tmp/ritmo-v1/public/app.js
          grep -Fq "Escolher mês" /tmp/ritmo-v1/public/app.js
          grep -Fq "Personalizar atalhos" /tmp/ritmo-v1/public/app.js
          grep -Fq "shortcutDraft" /tmp/ritmo-v1/public/app.js
          grep -Fq "data-shortcut-move" /tmp/ritmo-v1/public/app.js
          grep -Fq "function fabHtml" /tmp/ritmo-v1/public/app.js
          grep -Fq "if(!type)return ''" /tmp/ritmo-v1/public/app.js
          grep -Fq "data-system-update" /tmp/ritmo-v1/public/app.js
          grep -Fq "updateSystemNow" /tmp/ritmo-v1/public/app.js
          grep -Fq "menu-update-btn" /tmp/ritmo-v1/public/app.js
          grep -Fq "['more','Menu','menu']" /tmp/ritmo-v1/public/app.js
          grep -Fq "head('Menu'" /tmp/ritmo-v1/public/app.js
          grep -Fq "ritmo-logo.png" /tmp/ritmo-v1/public/app.js
          grep -Fq "ritmo-icon-192.png" /tmp/ritmo-v1/public/app.js
          grep -Fq "navigator.serviceWorker.getRegistrations" /tmp/ritmo-v1/public/app.js
          grep -Fq "caches.keys" /tmp/ritmo-v1/public/app.js
          grep -Fq "ritmo-shell-v1-current" /tmp/ritmo-v1/public/sw.js
          grep -Fq "ritmo-icon-512.png" /tmp/ritmo-v1/public/sw.js
          grep -Fq "cache:'no-store'" /tmp/ritmo-v1/public/sw.js
          grep -Fq "CLEAR_RITMO_CACHE" /tmp/ritmo-v1/public/sw.js
          grep -Fq "Cache-Control: no-cache, no-store, must-revalidate" /tmp/ritmo-v1/public/_headers
          grep -Fq "mobile_shortcuts" /tmp/ritmo-v1/_worker.js
          grep -Fq "seen_notifications" /tmp/ritmo-v1/_worker.js
          grep -Fq "user_mobile_settings" /tmp/ritmo-v1/schema.sql
          grep -Fq "120000" /tmp/ritmo-v1/public/app.js
          grep -Fq "Biometria e chave de acesso" /tmp/ritmo-v1/public/app.js
          grep -Fq "deviceSecurityHint" /tmp/ritmo-v1/public/app.js
          grep -Fq "Samsung Pass" /tmp/ritmo-v1/public/app.js
          grep -Fq "Face ID/Touch ID" /tmp/ritmo-v1/public/app.js
          grep -Fq "authenticatorAttachment:'platform'" /tmp/ritmo-v1/_worker.js
          grep -Fq "userVerification:'required'" /tmp/ritmo-v1/_worker.js
          grep -Fq '"/ritmo-icon-192.png"' /tmp/ritmo-v1/public/manifest.webmanifest
          grep -Fq '"/ritmo-icon-512.png"' /tmp/ritmo-v1/public/manifest.webmanifest
          test -s /tmp/ritmo-v1/public/ritmo-logo.png
          test -s /tmp/ritmo-v1/public/ritmo-icon-192.png
          test -s /tmp/ritmo-v1/public/ritmo-icon-512.png

          # Compartilhamento: schema, rotas, permissões e UX.
          grep -Fq "CREATE TABLE IF NOT EXISTS partnerships" /tmp/ritmo-v1/schema.sql
          grep -Fq "CREATE TABLE IF NOT EXISTS shared_goals" /tmp/ritmo-v1/schema.sql
          grep -Fq "CREATE TABLE IF NOT EXISTS shared_goal_contributions" /tmp/ritmo-v1/schema.sql
          grep -Fq "partnership_members" /tmp/ritmo-v1/_worker.js
          grep -Fq "/api/sharing/invite" /tmp/ritmo-v1/_worker.js
          grep -Fq "/api/sharing/accept-code" /tmp/ritmo-v1/_worker.js
          grep -Fq "/api/sharing/scope" /tmp/ritmo-v1/_worker.js
          grep -Fq "/api/shared" /tmp/ritmo-v1/_worker.js
          grep -Fq "bumpPartnership" /tmp/ritmo-v1/_worker.js
          grep -Fq "Compartilhamento" /tmp/ritmo-v1/public/app.js
          grep -Fq "Meu Ritmo" /tmp/ritmo-v1/public/app.js
          grep -Fq "Nosso Ritmo" /tmp/ritmo-v1/public/app.js
          grep -Fq "Individual" /tmp/ritmo-v1/public/app.js
          grep -Fq "Juntos" /tmp/ritmo-v1/public/app.js
          grep -Fq "goal_scope" /tmp/ritmo-v1/public/app.js
          grep -Fq "sharing:['sharing','Compartilhar','users']" /tmp/ritmo-v1/public/app.js
          grep -Fq "'sharing'" /tmp/ritmo-v1/_worker.js

          # Organização iOS, Personalização e foto de perfil real.
          grep -Fq "Personalização" /tmp/ritmo-v1/public/app.js
          grep -Fq "Atalhos da barra inferior" /tmp/ritmo-v1/public/app.js
          grep -Fq "data-page=\"shortcuts\"" /tmp/ritmo-v1/public/app.js
          grep -Fq "ios-menu-profile" /tmp/ritmo-v1/public/app.js
          grep -Fq "profile-ios-hero" /tmp/ritmo-v1/public/app.js
          grep -Fq "data-profile-photo" /tmp/ritmo-v1/public/app.js
          grep -Fq "avatarInput" /tmp/ritmo-v1/public/app.js
          grep -Fq "optimizeAvatar" /tmp/ritmo-v1/public/app.js
          grep -Fq "'/api/avatar'" /tmp/ritmo-v1/public/app.js
          grep -Fq "Conta sincronizada" /tmp/ritmo-v1/public/app.js
          grep -Fq "Nosso Ritmo ativo" /tmp/ritmo-v1/public/app.js
          grep -Fq ".ios-list-card" /tmp/ritmo-v1/public/styles.css
          grep -Fq ".profile-avatar-xl" /tmp/ritmo-v1/public/styles.css

          # Persistência importante continua fora do localStorage.
          ! grep -Fq "},8000)" /tmp/ritmo-v1/public/app.js
          ! grep -Fq "ritmo:seen:" /tmp/ritmo-v1/public/app.js
          ! grep -E "localStorage\.(setItem|getItem).*mobile_shortcuts|localStorage\.(setItem|getItem).*seen_notifications|localStorage\.(setItem|getItem).*partnership|localStorage\.(setItem|getItem).*view_scope" /tmp/ritmo-v1/public/app.js

      - name: Validar schema localmente
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/ritmo-schema-test.db
          sqlite3 /tmp/ritmo-schema-test.db < /tmp/ritmo-v1/schema.sql
          sqlite3 /tmp/ritmo-schema-test.db ".tables" | grep -Fq "partnerships"
          sqlite3 /tmp/ritmo-schema-test.db ".tables" | grep -Fq "shared_goals"

      - name: Build de produção
        working-directory: /tmp/ritmo-v1
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/styles.css
          test -s dist/_worker.js
          test -s dist/sw.js
          test -s dist/_headers
          test -s dist/ritmo-logo.png
          test -s dist/ritmo-icon-192.png
          test -s dist/ritmo-icon-512.png
          grep -Fq "Personalizar atalhos" dist/app.js
          grep -Fq "data-shortcut-move" dist/app.js
          grep -Fq "function fabHtml" dist/app.js
          grep -Fq "data-system-update" dist/app.js
          grep -Fq "menu-update-btn" dist/app.js
          grep -Fq "['more','Menu','menu']" dist/app.js
          grep -Fq "Biometria e chave de acesso" dist/app.js
          grep -Fq "Samsung Pass" dist/app.js
          grep -Fq "ritmo-logo.png" dist/app.js
          grep -Fq "ritmo-shell-v1-current" dist/sw.js
          grep -Fq "Nosso Ritmo" dist/app.js
          grep -Fq "goal_scope" dist/app.js
          grep -Fq "/api/shared" dist/_worker.js
          grep -Fq "partnership_members" dist/_worker.js
          grep -Fq "Personalização" dist/app.js
          grep -Fq "profile-ios-hero" dist/app.js
          grep -Fq "optimizeAvatar" dist/app.js

      - name: Empacotar Versão 1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ritmo-v6
          mkdir -p ritmo-v6
          tar -C /tmp/ritmo-v1 --exclude=node_modules --exclude=dist -czf /tmp/ritmo-v1.tgz .
          base64 -w0 /tmp/ritmo-v1.tgz > /tmp/ritmo-v1.b64
          split -b 6000 -d -a 2 /tmp/ritmo-v1.b64 ritmo-v6/part-
          B64_SHA="$(sha256sum /tmp/ritmo-v1.b64 | awk '{print $1}')"
          TGZ_SHA="$(sha256sum /tmp/ritmo-v1.tgz | awk '{print $1}')"
          printf 'B64_SHA=%s\nTGZ_SHA=%s\n' "$B64_SHA" "$TGZ_SHA" > ritmo-v6/HASHES.txt

      - name: Publicar pacote no repositório
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Rocha Tech CI"
          git config user.email "actions@users.noreply.github.com"
          git add ritmo-v6
          if git diff --cached --quiet; then
            echo "Pacote já está atualizado."
            exit 0
          fi
          git commit -m "Ritmo V1: compartilhamento, organização iOS e perfil"
          git push origin HEAD:main
