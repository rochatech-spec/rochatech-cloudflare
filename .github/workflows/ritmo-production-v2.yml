name: Ritmo production v2

on:
  push:
    branches: [main]
    paths:
      - "ritmo-bundle/**"
      - ".github/workflows/ritmo-production-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ritmo-production-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restaurar projeto Ritmo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ritmo-build
          mkdir -p ritmo-build
          cat ritmo-bundle/part-* > /tmp/ritmo.b64
          echo "6067974a8de59e1bbe64c2fc21f16a10595deca264544a24a0816d09fdb73640  /tmp/ritmo.b64" | sha256sum -c -
          base64 -d /tmp/ritmo.b64 > /tmp/ritmo.tgz
          echo "98be91a5a1aef22682cab9a73fc56df06bc0d13887c05deadb532799a0619c3a  /tmp/ritmo.tgz" | sha256sum -c -
          tar -xzf /tmp/ritmo.tgz -C ritmo-build
          test -s ritmo-build/package.json
          test -s ritmo-build/schema.sql
          test -s ritmo-build/_worker.js
          test -s ritmo-build/public/index.html
          test -s ritmo-build/public/app.js
          test -s ritmo-build/public/styles.css

      - name: Instalar dependências
        working-directory: ritmo-build
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: ritmo-build
        run: npm run build

      - name: Validar PWA
        shell: bash
        run: |
          set -euo pipefail
          test -s ritmo-build/dist/index.html
          test -s ritmo-build/dist/manifest.webmanifest
          test -s ritmo-build/dist/sw.js
          test -s ritmo-build/dist/_worker.js
          grep -q '<title>Ritmo</title>' ritmo-build/dist/index.html
          grep -q 'standalone' ritmo-build/dist/manifest.webmanifest

      - name: Iniciar autorização Cloudflare
        id: cfauth
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/ritmo-build/cloudflare-device-login.txt"
          PID="$GITHUB_WORKSPACE/ritmo-build/cloudflare-device-login.pid"
          rm -f "$LOG" "$PID"
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "Credencial de CI encontrada." > "$LOG"
            exit 0
          fi
          echo "mode=device" >> "$GITHUB_OUTPUT"
          echo "Iniciando autorização Cloudflare por dispositivo..." > "$LOG"
          (
            unset RUNNER_TRACKING_ID
            nohup npx --yes wrangler@latest login --device --browser=false >> "$LOG" 2>&1 &
            echo $! > "$PID"
          )
          for i in {1..45}; do
            if grep -q 'dash.cloudflare.com/oauth2/device' "$LOG"; then
              cat "$LOG"
              exit 0
            fi
            if [ -f "$PID" ] && ! kill -0 "$(cat "$PID")" 2>/dev/null; then
              cat "$LOG"
              exit 1
            fi
            sleep 1
          done
          cat "$LOG"
          echo "Não foi possível obter o código de autorização a tempo."
          exit 1

      - name: Disponibilizar código de autorização
        if: steps.cfauth.outputs.mode == 'device'
        uses: actions/upload-artifact@v4
        with:
          name: ritmo-cloudflare-authorization
          path: ritmo-build/cloudflare-device-login.txt
          retention-days: 1

      - name: Aguardar autorização Cloudflare
        if: steps.cfauth.outputs.mode == 'device'
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/ritmo-build/cloudflare-device-login.txt"
          PID="$GITHUB_WORKSPACE/ritmo-build/cloudflare-device-login.pid"
          test -s "$PID"
          P="$(cat "$PID")"
          for i in {1..300}; do
            if npx --yes wrangler@latest whoami --json >/tmp/whoami.json 2>/dev/null; then
              echo "Cloudflare autorizado com sucesso."
              exit 0
            fi
            if ! kill -0 "$P" 2>/dev/null; then
              cat "$LOG"
              echo "Processo de autorização terminou antes da confirmação."
              exit 1
            fi
            sleep 1
          done
          cat "$LOG"
          echo "Tempo de autorização expirou."
          exit 1

      - name: Descobrir conta Cloudflare
        id: account
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest whoami --json > /tmp/whoami.json
          ACCOUNT_ID="$(node -e "const d=require('/tmp/whoami.json');const a=d.accounts?.[0];if(!a?.id)process.exit(2);process.stdout.write(a.id)")"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Garantir projeto Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages project list --json > /tmp/pages-raw.txt
          node - <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('/tmp/pages-raw.txt','utf8');
          const i=raw.indexOf('[');
          if(i<0) process.exit(2);
          const a=JSON.parse(raw.slice(i));
          process.exit(a.some(x=>x.name==='ritmo')?0:1);
          NODE
          RC=$?
          if [ "$RC" -ne 0 ]; then
            npx --yes wrangler@latest pages project create ritmo --production-branch main
          fi

      - name: Garantir D1
        id: d1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 list --json > /tmp/d1.json
          if ! node -e "const d=require('/tmp/d1.json');const a=Array.isArray(d)?d:(d.result||[]);process.exit(a.some(x=>x.name==='ritmo-db')?0:1)"; then
            npx --yes wrangler@latest d1 create ritmo-db --location enam
            npx --yes wrangler@latest d1 list --json > /tmp/d1.json
          fi
          DB_ID="$(node -e "const d=require('/tmp/d1.json');const a=(Array.isArray(d)?d:(d.result||[])).find(x=>x.name==='ritmo-db');if(!a)process.exit(2);process.stdout.write(a.uuid||a.id)")"
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Garantir R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        shell: bash
        run: |
          set -euo pipefail
          if ! npx --yes wrangler@latest r2 bucket list 2>/tmp/r2err.txt | grep -q 'ritmo-private'; then
            npx --yes wrangler@latest r2 bucket create ritmo-private
          fi

      - name: Configurar bindings
        working-directory: ritmo-build
        env:
          DB_ID: ${{ steps.d1.outputs.db_id }}
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.toml <<EOF
          name = "ritmo"
          compatibility_date = "2026-09-05"
          pages_build_output_dir = "./dist"

          [[d1_databases]]
          binding = "DB"
          database_name = "ritmo-db"
          database_id = "$DB_ID"

          [[r2_buckets]]
          binding = "AVATARS"
          bucket_name = "ritmo-private"

          [vars]
          APP_NAME = "Ritmo"
          APP_URL = "https://ritmo.pages.dev"
          EOF

      - name: Aplicar schema D1
        working-directory: ritmo-build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: npx --yes wrangler@latest d1 execute ritmo-db --remote --file ./schema.sql

      - name: Publicar Ritmo
        working-directory: ritmo-build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: npx --yes wrangler@latest pages deploy dist --project-name ritmo --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true

      - name: Validar produção
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ritmo.pages.dev"
          for i in {1..36}; do
            HC="$(curl -sS -o /tmp/health.json -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/api/health?build=$GITHUB_SHA" || true)"
            PC="$(curl -sS -o /tmp/index.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/?build=$GITHUB_SHA" || true)"
            if [ "$HC" = "200" ] && [ "$PC" = "200" ] && grep -q '"ok":true' /tmp/health.json && grep -q '<title>Ritmo</title>' /tmp/index.html; then
              echo "Ritmo publicado: $BASE"
              exit 0
            fi
            sleep 5
          done
          echo "Falha ao validar $BASE"
          cat /tmp/health.json || true
          exit 1
