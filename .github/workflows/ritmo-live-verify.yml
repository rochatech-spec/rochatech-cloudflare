name: Ritmo V1 live verify

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ritmo-live-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruir pacote atual
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ritmo && mkdir -p /tmp/ritmo
          cat ritmo-v6/part-* > /tmp/ritmo.b64
          base64 -d /tmp/ritmo.b64 > /tmp/ritmo.tgz
          tar -xzf /tmp/ritmo.tgz -C /tmp/ritmo
          cd /tmp/ritmo
          npm install --no-audit --no-fund >/dev/null
          npm run build >/dev/null
      - name: Comparar produção com pacote
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ritmo-br.pages.dev'
          curl -fsS -H 'Cache-Control: no-cache' "$BASE/app.js?verify=$GITHUB_SHA" -o /tmp/live-app.js
          curl -fsS -H 'Cache-Control: no-cache' "$BASE/styles.css?verify=$GITHUB_SHA" -o /tmp/live-styles.css
          curl -fsS -H 'Cache-Control: no-cache' "$BASE/sw.js?verify=$GITHUB_SHA" -o /tmp/live-sw.js
          echo 'EXPECTED_APP_SHA='$(sha256sum /tmp/ritmo/dist/app.js | awk '{print $1}')
          echo 'LIVE_APP_SHA='$(sha256sum /tmp/live-app.js | awk '{print $1}')
          echo 'EXPECTED_CSS_SHA='$(sha256sum /tmp/ritmo/dist/styles.css | awk '{print $1}')
          echo 'LIVE_CSS_SHA='$(sha256sum /tmp/live-styles.css | awk '{print $1}')
          echo '=== refined markers live ==='
          grep -F 'shortcutDraftKeys' /tmp/live-app.js | head -1 || true
          grep -F 'Desmarque um atalho antes de escolher outro.' /tmp/live-app.js | head -1 || true
          grep -F 'function fabHtml()' /tmp/live-app.js | head -1 || true
          grep -F 'Acesse ferramentas, conta e informações do Ritmo.' /tmp/live-app.js | head -1 || true
          echo '=== service worker cache ==='
          grep -E "const CACHE=" /tmp/live-sw.js || true
          cmp -s /tmp/ritmo/dist/app.js /tmp/live-app.js && echo 'APP_MATCH=YES' || echo 'APP_MATCH=NO'
          cmp -s /tmp/ritmo/dist/styles.css /tmp/live-styles.css && echo 'CSS_MATCH=YES' || echo 'CSS_MATCH=NO'
