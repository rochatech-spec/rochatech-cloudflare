name: Ritmo Commercial • Push Scheduler

on:
  schedule:
    - cron: "15 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disparar-notificacoes:
    name: Disparar notificações diárias
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar API de notificações
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 5 \
            -X POST \
            -H 'Accept: application/json' \
            https://ritmo-commercial.pages.dev/api/push/cron)"
          echo "$BODY"
          node -e '
            const d = JSON.parse(process.argv[1]);
            if (d?.ok !== true) process.exit(1);
          ' "$BODY"
