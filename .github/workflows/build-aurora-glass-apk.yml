name: Build Aurora Glass APK

on:
  push:
    branches:
      - aurora-glass-s25fe
    paths:
      - 'ios-oneui-theme/**'
      - '.github/workflows/build-aurora-glass-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: ios-oneui-theme
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp ios-oneui-theme/app/build/outputs/apk/debug/app-debug.apk dist/Aurora-Glass-S25FE.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Glass-S25FE
          path: dist/Aurora-Glass-S25FE.apk
          if-no-files-found: error
