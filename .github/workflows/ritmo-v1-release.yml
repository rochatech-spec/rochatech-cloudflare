name: Ritmo V1 release Rocha Tech

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ritmo-v1-release.yml"
      - ".github/scripts/ritmo_v1_fix_sharing_runner.py"
      - ".github/scripts/ritmo_v1_sharing_patch.py"
      - ".github/scripts/ritmo_v1_ios_organization_patch.py"
      - ".github/scripts/ritmo_v1_welcome_install_patch.py"
      - ".github/scripts/ritmo_v1_avatar_cloud_fallback.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ritmo-v1-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruir Ritmo Versão 1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ritmo-v1
          mkdir -p /tmp/ritmo-v1
          cat ritmo-v5/part-* > /tmp/ritmo-base.b64
          base64 -d /tmp/ritmo-base.b64 > /tmp/ritmo-base.tgz
          tar -xzf /tmp/ritmo-base.tgz -C /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v6_backend.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v6_ui.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v7_ux_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_update_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_device_security_ux.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_brand_menu_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_fix_sharing_runner.py
          python3 .github/scripts/ritmo_v1_sharing_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_ios_organization_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_avatar_cloud_fallback.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_welcome_install_patch.py /tmp/ritmo-v1

      - name: Validar Versão 1 completa
        shell: bash
        run: |
          set -euo pipefail
          node --check /tmp/ritmo-v1/public/app.js
          node --check /tmp/ritmo-v1/_worker.js
          node --check /tmp/ritmo-v1/public/sw.js
          rm -f /tmp/ritmo-schema-test.db
          sqlite3 /tmp/ritmo-schema-test.db < /tmp/ritmo-v1/schema.sql

          # Identidade, Menu e atualização
          grep -Fq "['more','Menu','menu']" /tmp/ritmo-v1/public/app.js
          grep -Fq "head('Menu'" /tmp/ritmo-v1/public/app.js
          grep -Fq "menu-update-btn" /tmp/ritmo-v1/public/app.js
          grep -Fq "data-system-update" /tmp/ritmo-v1/public/app.js
          grep -Fq "CLEAR_RITMO_CACHE" /tmp/ritmo-v1/public/sw.js
          grep -Fq "ritmo-logo.png" /tmp/ritmo-v1/public/app.js
          test -s /tmp/ritmo-v1/public/ritmo-logo.png
          test -s /tmp/ritmo-v1/public/ritmo-icon-192.png
          test -s /tmp/ritmo-v1/public/ritmo-icon-512.png

          # Filtros e atalhos cloud-first
          grep -Fq "Últimos 7 dias" /tmp/ritmo-v1/public/app.js
          grep -Fq "Últimos 15 dias" /tmp/ritmo-v1/public/app.js
          grep -Fq "Últimos 30 dias" /tmp/ritmo-v1/public/app.js
          grep -Fq "Escolher mês" /tmp/ritmo-v1/public/app.js
          grep -Fq "Atalhos da barra inferior" /tmp/ritmo-v1/public/app.js
          grep -Fq "data-shortcut-move" /tmp/ritmo-v1/public/app.js
          grep -Fq "mobile_shortcuts" /tmp/ritmo-v1/_worker.js
          grep -Fq "user_mobile_settings" /tmp/ritmo-v1/schema.sql

          # Compartilhamento e metas Individual/Juntos
          grep -Fq "CREATE TABLE IF NOT EXISTS partnerships" /tmp/ritmo-v1/schema.sql
          grep -Fq "CREATE TABLE IF NOT EXISTS shared_goals" /tmp/ritmo-v1/schema.sql
          grep -Fq "/api/sharing/invite" /tmp/ritmo-v1/_worker.js
          grep -Fq "/api/sharing/accept-code" /tmp/ritmo-v1/_worker.js
          grep -Fq "/api/shared" /tmp/ritmo-v1/_worker.js
          grep -Fq "Meu Ritmo" /tmp/ritmo-v1/public/app.js
          grep -Fq "Nosso Ritmo" /tmp/ritmo-v1/public/app.js
          grep -Fq "goal_scope" /tmp/ritmo-v1/public/app.js
          grep -Fq "Juntos" /tmp/ritmo-v1/public/app.js

          # Organização estilo iOS, Personalização e perfil real
          grep -Fq "Personalização" /tmp/ritmo-v1/public/app.js
          grep -Fq "ios-menu-profile" /tmp/ritmo-v1/public/app.js
          grep -Fq "profile-ios-hero" /tmp/ritmo-v1/public/app.js
          grep -Fq "data-profile-photo" /tmp/ritmo-v1/public/app.js
          grep -Fq "optimizeAvatar" /tmp/ritmo-v1/public/app.js
          grep -Fq "avatar cloud-first" /tmp/ritmo-v1/_worker.js || true
          grep -Fq "getWithMetadata" /tmp/ritmo-v1/_worker.js
          grep -Fq "avatar:${userId}" /tmp/ritmo-v1/_worker.js

          # Segurança do aparelho
          grep -Fq "Biometria e chave de acesso" /tmp/ritmo-v1/public/app.js
          grep -Fq "Samsung Pass" /tmp/ritmo-v1/public/app.js
          grep -Fq "Face ID/Touch ID" /tmp/ritmo-v1/public/app.js
          grep -Fq "authenticatorAttachment:'platform'" /tmp/ritmo-v1/_worker.js
          grep -Fq "userVerification:'required'" /tmp/ritmo-v1/_worker.js

          # Boas-vindas e instalação
          grep -Fq "ritmoWelcomeMount" /tmp/ritmo-v1/public/app.js
          grep -Fq "Instale no Android" /tmp/ritmo-v1/public/app.js
          grep -Fq "Instale no iPhone ou iPad" /tmp/ritmo-v1/public/app.js
          grep -Fq "Ritmo no seu computador" /tmp/ritmo-v1/public/app.js
          grep -Fq "Desenvolvedor: Flávio Rocha" /tmp/ritmo-v1/public/app.js
          grep -Fq ".ritmo-welcome" /tmp/ritmo-v1/public/styles.css

          # Dados importantes nunca viram localStorage.
          ! grep -E "localStorage\.(setItem|getItem).*mobile_shortcuts|localStorage\.(setItem|getItem).*partnership|localStorage\.(setItem|getItem).*view_scope" /tmp/ritmo-v1/public/app.js

      - name: Build de produção
        working-directory: /tmp/ritmo-v1
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/styles.css
          test -s dist/_worker.js
          test -s dist/sw.js
          test -s dist/_headers
          test -s dist/ritmo-logo.png
          test -s dist/ritmo-icon-192.png
          test -s dist/ritmo-icon-512.png
          grep -Fq "Desenvolvedor: Flávio Rocha" dist/app.js
          grep -Fq "Nosso Ritmo" dist/app.js
          grep -Fq "Personalização" dist/app.js
          grep -Fq "profile-ios-hero" dist/app.js
          grep -Fq "getWithMetadata" dist/_worker.js

      - name: Iniciar autorização Cloudflare
        id: cfauth
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/cloudflare-device-login.txt"
          PID="$GITHUB_WORKSPACE/cloudflare-device-login.pid"
          rm -f "$LOG" "$PID"
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mode=device" >> "$GITHUB_OUTPUT"
          (
            unset RUNNER_TRACKING_ID
            nohup npx --yes wrangler@latest login --device --browser=false > "$LOG" 2>&1 &
            echo $! > "$PID"
          )
          for i in {1..45}; do
            if grep -q 'dash.cloudflare.com/oauth2/device' "$LOG"; then
              cat "$LOG"
              exit 0
            fi
            sleep 1
          done
          cat "$LOG"
          exit 1

      - name: Disponibilizar autorização
        if: steps.cfauth.outputs.mode == 'device'
        uses: actions/upload-artifact@v4
        with:
          name: ritmo-v1-cloudflare-authorization
          path: cloudflare-device-login.txt
          retention-days: 1

      - name: Aguardar autorização
        if: steps.cfauth.outputs.mode == 'device'
        shell: bash
        run: |
          set -euo pipefail
          P="$(cat "$GITHUB_WORKSPACE/cloudflare-device-login.pid")"
          for i in {1..300}; do
            if npx --yes wrangler@latest whoami --json >/tmp/whoami.json 2>/dev/null; then exit 0; fi
            if ! kill -0 "$P" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          exit 1

      - name: Descobrir conta
        id: account
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest whoami --json > /tmp/whoami.json
          ACCOUNT_ID="$(node -e "const d=require('/tmp/whoami.json');const a=d.accounts?.[0];if(!a?.id)process.exit(2);process.stdout.write(a.id)")"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Garantir projeto ritmo-br
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        shell: bash
        run: |
          set -euo pipefail
          LIST="$(npx --yes wrangler@latest pages project list 2>&1)"
          if ! echo "$LIST" | grep -Eq '(^|[[:space:]│])ritmo-br([[:space:]│]|$)'; then
            npx --yes wrangler@latest pages project create ritmo-br --production-branch main
          fi

      - name: Garantir KV do Ritmo
        id: kv
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest kv namespace list > /tmp/kv-list.txt
          KV_ID="$(node <<'NODE'
          const fs=require('fs');const s=fs.readFileSync('/tmp/kv-list.txt','utf8');let id='';
          try{const d=JSON.parse(s),a=Array.isArray(d)?d:(d.result||[]),x=a.find(v=>(v.title||v.name)==='ritmo-br-cache');id=x?.id||''}catch{}
          if(!id){const line=s.split(/\r?\n/).find(l=>l.includes('ritmo-br-cache'))||'';id=(line.match(/[0-9a-f]{32}/i)||[])[0]||''}process.stdout.write(id);
          NODE
          )"
          if [ -z "$KV_ID" ]; then
            OUT="$(npx --yes wrangler@latest kv namespace create ritmo-br-cache 2>&1)"
            KV_ID="$(printf '%s\n' "$OUT" | grep -Eo '[0-9a-f]{32}' | head -1 || true)"
          fi
          test -n "$KV_ID"
          echo "kv_id=$KV_ID" >> "$GITHUB_OUTPUT"

      - name: Garantir Turnstile do Ritmo
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest turnstile widget list --json > /tmp/turnstile-list.json
          SITEKEY="$(node <<'NODE'
          const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/turnstile-list.json','utf8'));const a=Array.isArray(d)?d:(d.result||d.widgets||[]);const x=a.find(w=>w?.name==='Ritmo BR');process.stdout.write(x?.sitekey||'');
          NODE
          )"
          if [ -n "$SITEKEY" ]; then
            npx --yes wrangler@latest turnstile widget get "$SITEKEY" --json > /tmp/turnstile-widget.json
          else
            npx --yes wrangler@latest turnstile widget create "Ritmo BR" --domain ritmo-br.pages.dev --mode managed --json > /tmp/turnstile-widget.json
          fi
          node <<'NODE'
          const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/turnstile-widget.json','utf8'));function find(o){if(!o||typeof o!=='object')return null;if(typeof o.sitekey==='string'&&typeof o.secret==='string')return o;for(const v of Object.values(o)){const r=find(v);if(r)return r}return null}const w=find(d);if(!w)process.exit(2);fs.writeFileSync('/tmp/turnstile.sitekey',w.sitekey);fs.writeFileSync('/tmp/turnstile.secret',w.secret);
          NODE

      - name: Configurar bindings
        working-directory: /tmp/ritmo-v1
        shell: bash
        run: |
          set -euo pipefail
          SITEKEY="$(cat /tmp/turnstile.sitekey)"
          cat > wrangler.toml <<EOF
          name = "ritmo-br"
          compatibility_date = "2026-09-05"
          pages_build_output_dir = "./dist"

          [[d1_databases]]
          binding = "DB"
          database_name = "ritmo-db"
          database_id = "17baeadd-2140-4cf6-ad5b-0aa0390d1d16"

          [[kv_namespaces]]
          binding = "CACHE"
          id = "${{ steps.kv.outputs.kv_id }}"

          [vars]
          APP_NAME = "Ritmo"
          APP_URL = "https://ritmo-br.pages.dev"
          TURNSTILE_SITEKEY = "$SITEKEY"
          CBOR_NATIVE_ACCELERATION_DISABLED = "true"
          EOF

      - name: Atualizar segredo Turnstile
        working-directory: /tmp/ritmo-v1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        shell: bash
        run: |
          set -euo pipefail
          TURNSTILE_SECRET="$(cat /tmp/turnstile.secret)"
          echo "::add-mask::$TURNSTILE_SECRET"
          printf '%s' "$TURNSTILE_SECRET" | npx --yes wrangler@latest pages secret put TURNSTILE_SECRET --project-name ritmo-br

      - name: Aplicar schema D1
        working-directory: /tmp/ritmo-v1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: npx --yes wrangler@latest d1 execute ritmo-db --remote --file ./schema.sql

      - name: Publicar Ritmo Versão 1
        working-directory: /tmp/ritmo-v1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: npx --yes wrangler@latest pages deploy dist --project-name ritmo-br --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true

      - name: Validar produção real
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ritmo-br.pages.dev"
          for i in {1..36}; do
            HC="$(curl -sS -o /tmp/health.json -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/api/health?build=$GITHUB_SHA" || true)"
            JS="$(curl -sS -o /tmp/app.js -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/app.js?build=$GITHUB_SHA" || true)"
            CSS="$(curl -sS -o /tmp/styles.css -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/styles.css?build=$GITHUB_SHA" || true)"
            SW="$(curl -sS -o /tmp/sw.js -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/sw.js?build=$GITHUB_SHA" || true)"
            if [ "$HC" = "200" ] && [ "$JS" = "200" ] && [ "$CSS" = "200" ] && [ "$SW" = "200" ] && grep -q '"ok":true' /tmp/health.json && grep -Fq 'Desenvolvedor: Flávio Rocha' /tmp/app.js && grep -Fq 'Nosso Ritmo' /tmp/app.js && grep -Fq 'profile-ios-hero' /tmp/app.js && grep -Fq '.ritmo-welcome' /tmp/styles.css && grep -Fq 'CLEAR_RITMO_CACHE' /tmp/sw.js; then break; fi
            sleep 5
          done
          test "$HC" = "200"; test "$JS" = "200"; test "$CSS" = "200"; test "$SW" = "200"
          grep -q '"db":true' /tmp/health.json
          grep -q '"kv":true' /tmp/health.json
          grep -q '"turnstile":true' /tmp/health.json
          grep -q '"webauthn":true' /tmp/health.json
          grep -Fq 'Desenvolvedor: Flávio Rocha' /tmp/app.js
          grep -Fq 'Instale no Android' /tmp/app.js
          grep -Fq 'Instale no iPhone ou iPad' /tmp/app.js
          grep -Fq 'Ritmo no seu computador' /tmp/app.js
          grep -Fq 'Nosso Ritmo' /tmp/app.js
          grep -Fq 'Personalização' /tmp/app.js
          grep -Fq 'menu-update-btn' /tmp/app.js
          grep -Fq '.ritmo-welcome' /tmp/styles.css
          grep -Fq 'CLEAR_RITMO_CACHE' /tmp/sw.js
          echo "Ritmo Versão 1 validado em produção: $BASE"
