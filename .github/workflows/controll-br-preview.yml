name: CONTROL preview

on:
  push:
    branches: [control-redesign-v1]
    paths:
      - "control/**"
      - ".github/workflows/controll-br-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controll-br-preview
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control/package.json

      - name: Instalar dependências
        working-directory: control
        run: npm install --no-audit --no-fund

      - name: Build do CONTROL
        id: build
        working-directory: control
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          CODE=${PIPESTATUS[0]}
          echo "$CODE" > build.exit
          exit 0

      - name: Salvar diagnóstico do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-build-log
          path: |
            control/build.log
            control/build.exit
          retention-days: 1

      - name: Validar build e identidade
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat control/build.exit)" = "0" || { cat control/build.log; exit 1; }
          test -s control/dist/index.html
          test -s control/dist/manifest.json
          test -s control/dist/sw.js
          test -s control/dist/control-logo-gold.svg
          grep -q 'CONTROL' control/dist/index.html
          grep -q 'standalone' control/dist/manifest.json

      - name: Iniciar autorização Cloudflare
        id: cfauth
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/control/cloudflare-device-login.txt"
          PID="$GITHUB_WORKSPACE/control/cloudflare-device-login.pid"
          rm -f "$LOG" "$PID"
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "Credencial de CI encontrada." > "$LOG"
            exit 0
          fi
          echo "mode=device" >> "$GITHUB_OUTPUT"
          echo "Iniciando autorização Cloudflare por dispositivo..." > "$LOG"
          (
            unset RUNNER_TRACKING_ID
            nohup npx --yes wrangler@latest login --device --browser=false >> "$LOG" 2>&1 &
            echo $! > "$PID"
          )
          for i in {1..45}; do
            if grep -q 'dash.cloudflare.com/oauth2/device' "$LOG"; then
              cat "$LOG"
              exit 0
            fi
            if [ -f "$PID" ] && ! kill -0 "$(cat "$PID")" 2>/dev/null; then
              cat "$LOG"
              exit 1
            fi
            sleep 1
          done
          echo "Não foi possível obter o código de autorização a tempo." >> "$LOG"
          cat "$LOG"
          exit 1

      - name: Disponibilizar código de autorização
        if: steps.cfauth.outputs.mode == 'device'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-device-authorization
          path: control/cloudflare-device-login.txt
          retention-days: 1

      - name: Aguardar autorização Cloudflare
        if: steps.cfauth.outputs.mode == 'device'
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/control/cloudflare-device-login.txt"
          PID="$GITHUB_WORKSPACE/control/cloudflare-device-login.pid"
          test -s "$PID"
          P="$(cat "$PID")"
          for i in {1..300}; do
            if npx --yes wrangler@latest whoami --json >/tmp/whoami.json 2>/dev/null; then
              echo "Cloudflare autorizado com sucesso."
              exit 0
            fi
            if ! kill -0 "$P" 2>/dev/null; then
              cat "$LOG"
              echo "Processo de autorização terminou antes da confirmação."
              exit 1
            fi
            sleep 1
          done
          cat "$LOG"
          echo "Tempo de autorização expirou."
          exit 1

      - name: Descobrir conta Cloudflare
        id: account
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest whoami --json > /tmp/whoami.json
          ACCOUNT_ID="$(node -e "const d=require('/tmp/whoami.json');const a=d.accounts?.[0];if(!a?.id)process.exit(2);process.stdout.write(a.id)")"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "Conta Cloudflare autenticada."

      - name: Publicar preview
        working-directory: control
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: npx --yes wrangler@latest pages deploy dist --project-name controll-br --branch control-redesign-v1 --commit-hash "$GITHUB_SHA"

      - name: Validar preview publicado
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://control-redesign-v1.controll-br.pages.dev"
          for i in {1..24}; do
            CODE="$(curl -sS -o /tmp/control.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/?build=$GITHUB_SHA" || true)"
            HEALTH_CODE="$(curl -sS -o /tmp/control-health.json -w '%{http_code}' "$BASE/api/health?build=$GITHUB_SHA" || true)"
            if [ "$CODE" = "200" ] && [ "$HEALTH_CODE" = "200" ] && grep -q 'CONTROL' /tmp/control.html && grep -q '"ok":true' /tmp/control-health.json; then
              echo "CONTROL preview validado: $BASE"; exit 0
            fi
            sleep 5
          done
          echo "::error::Preview do CONTROL não passou na validação"; cat /tmp/control-health.json || true; exit 1
