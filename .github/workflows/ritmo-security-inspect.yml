name: Ritmo V1 security inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ritmo-security-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir pacote atual
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ritmo && mkdir -p /tmp/ritmo
          cat ritmo-v6/part-* > /tmp/ritmo.b64
          base64 -d /tmp/ritmo.b64 > /tmp/ritmo.tgz
          tar -xzf /tmp/ritmo.tgz -C /tmp/ritmo
      - name: Inspecionar WebAuthn
        shell: bash
        run: |
          set -euo pipefail
          echo '=== APP ==='
          grep -nEi -C 4 'webauthn|biom[eé]tr|passkey|navigator\.credentials|publicKey|authenticatorAttachment|userVerification' /tmp/ritmo/public/app.js || true
          echo '=== WORKER ==='
          grep -nEi -C 4 'webauthn|passkey|publicKey|authenticatorAttachment|userVerification|rpID|rpId' /tmp/ritmo/_worker.js || true
