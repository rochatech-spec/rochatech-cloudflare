name: Ritmo auth smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ritmo-auth-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Testar cadastro, sessão, bootstrap e login
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ritmo-96q.pages.dev"
          USER="ritmoqa${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          PASS="RitmoQA-${GITHUB_RUN_ID}-Aa9!"
          COOKIE1="$(mktemp)"
          COOKIE2="$(mktemp)"

          HC="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$BASE/api/health?smoke=$GITHUB_RUN_ID")"
          test "$HC" = "200"
          grep -q '"ok":true' /tmp/health.json
          grep -q '"db":true' /tmp/health.json

          RC="$(curl -sS -o /tmp/register.json -w '%{http_code}' -c "$COOKIE1" \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://ritmo-96q.pages.dev' \
            --data "{\"name\":\"Ritmo QA\",\"username\":\"$USER\",\"password\":\"$PASS\"}" \
            "$BASE/api/auth/register")"
          test "$RC" = "201"
          grep -q '"ok":true' /tmp/register.json

          BC="$(curl -sS -o /tmp/bootstrap.json -w '%{http_code}' -b "$COOKIE1" \
            -H 'Origin: https://ritmo-96q.pages.dev' \
            "$BASE/api/bootstrap")"
          test "$BC" = "200"
          grep -q '"profile"' /tmp/bootstrap.json
          grep -q "\"username\":\"$USER\"" /tmp/bootstrap.json

          LC="$(curl -sS -o /tmp/login.json -w '%{http_code}' -c "$COOKIE2" \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://ritmo-96q.pages.dev' \
            --data "{\"username\":\"$USER\",\"password\":\"$PASS\"}" \
            "$BASE/api/auth/login")"
          test "$LC" = "200"
          grep -q '"ok":true' /tmp/login.json

          echo "RITMO_AUTH_SMOKE_OK"
