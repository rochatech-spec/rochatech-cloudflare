name: Ritmo V1 temporary source export

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ritmo-source-export.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extrair fonte atual
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ritmo && mkdir -p /tmp/ritmo
          cat ritmo-v6/part-* > /tmp/ritmo.b64
          base64 -d /tmp/ritmo.b64 > /tmp/ritmo.tgz
          tar -xzf /tmp/ritmo.tgz -C /tmp/ritmo
          mkdir -p .ritmo-debug
          cp /tmp/ritmo/_worker.js .ritmo-debug/worker.js
          cp /tmp/ritmo/public/app.js .ritmo-debug/app.js
          cp /tmp/ritmo/schema.sql .ritmo-debug/schema.sql
      - name: Publicar snapshot temporário
        shell: bash
        run: |
          git config user.name "Rocha Tech CI"
          git config user.email "actions@users.noreply.github.com"
          git add .ritmo-debug
          git commit -m "Ritmo V1: snapshot temporário para compartilhamento" || exit 0
          git push origin HEAD:main
