name: Ritmo production

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ritmo-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ritmo-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restaurar projeto Ritmo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ritmo
          echo '' | base64 -d > /tmp/ritmo.tgz
          tar -xzf /tmp/ritmo.tgz -C ritmo
      - name: Instalar ferramentas
        working-directory: ritmo
        run: npm install --no-audit --no-fund
      - name: Descobrir conta Cloudflare
        id: account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          npx --yes wrangler@latest whoami --json > /tmp/whoami.json
          ACCOUNT_ID="$(node -e \"const d=require('/tmp/whoami.json');const a=d.accounts?.[0];if(!a?.id)process.exit(2);process.stdout.write(a.id)\")"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
      - name: Garantir projeto Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages project list --json > /tmp/pages.json
          if ! node -e "const d=require('/tmp/pages.json');const a=Array.isArray(d)?d:(d.result||[]);process.exit(a.some(x=>x.name==='ritmo')?0:1)"; then
            npx --yes wrangler@latest pages project create ritmo --production-branch main
          fi
      - name: Garantir D1 e R2
        id: resources
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 list --json > /tmp/d1.json
          if ! node -e "const d=require('/tmp/d1.json');const a=Array.isArray(d)?d:(d.result||[]);process.exit(a.some(x=>x.name==='ritmo-db')?0:1)"; then
            npx --yes wrangler@latest d1 create ritmo-db --location enam
            npx --yes wrangler@latest d1 list --json > /tmp/d1.json
          fi
          DB_ID="$(node -e \"const d=require('/tmp/d1.json');const a=(Array.isArray(d)?d:(d.result||[])).find(x=>x.name==='ritmo-db');if(!a)process.exit(2);process.stdout.write(a.uuid||a.id)\")"
          if ! npx --yes wrangler@latest r2 bucket list 2>/tmp/r2err.txt | grep -q 'ritmo-private'; then
            npx --yes wrangler@latest r2 bucket create ritmo-private --location enam
          fi
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"
      - name: Aplicar schema
        working-directory: ritmo
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: npx --yes wrangler@latest d1 execute ritmo-db --remote --file schema.sql
      - name: Conectar D1 e R2 ao Ritmo
        env:
          ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
          DB_ID: ${{ steps.resources.outputs.db_id }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >/tmp/patch.json
          const cfg={compatibility_date:'2026-09-05',d1_databases:{DB:{id:process.env.DB_ID}},r2_buckets:{AVATARS:{name:'ritmo-private'}}};
          process.stdout.write(JSON.stringify({deployment_configs:{production:cfg,preview:cfg}}));
          NODE
          curl -fsS -X PATCH "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/ritmo" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/patch.json > /tmp/patch-response.json
          node -e "const d=require('/tmp/patch-response.json');if(d.success!==true){console.error(d.errors||d);process.exit(2)}"
      - name: Build
        working-directory: ritmo
        run: npm run build
      - name: Publicar
        working-directory: ritmo
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: npx --yes wrangler@latest pages deploy dist --project-name ritmo --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
      - name: Validar link público
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ritmo.pages.dev"
          for i in {1..36}; do
            HC="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$BASE/api/health?build=$GITHUB_SHA" || true)"
            PC="$(curl -sS -o /tmp/index.html -w '%{http_code}' "$BASE/?build=$GITHUB_SHA" || true)"
            if [ "$HC" = "200" ] && [ "$PC" = "200" ] && grep -q '"ok":true' /tmp/health.json && grep -q '<title>Ritmo</title>' /tmp/index.html; then
              echo "Ritmo publicado: $BASE"
              exit 0
            fi
            sleep 5
          done
          echo "Falha ao validar $BASE"
          cat /tmp/health.json || true
          exit 1
