name: Ritmo production v5 secure Rocha Tech

on:
  push:
    branches: [main]
    paths:
      - "ritmo-v5/**"
      - ".github/workflows/ritmo-production-v5.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ritmo-production-v5
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restaurar Ritmo v5 seguro
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ritmo-build
          mkdir -p ritmo-build
          cat ritmo-v5/part-* > /tmp/ritmo-v5.b64
          echo "90454b4eb7078d892b72888b93a622d2bc8e60d5724ad71eb53cad0ae4bcb3ce  /tmp/ritmo-v5.b64" | sha256sum -c -
          base64 -d /tmp/ritmo-v5.b64 > /tmp/ritmo-v5.tgz
          echo "2575eb59c16a147825f4fa52fcb41c001ea2ec4df8070a811079f0a6971d2e02  /tmp/ritmo-v5.tgz" | sha256sum -c -
          tar -xzf /tmp/ritmo-v5.tgz -C ritmo-build
          grep -Fq 'mobileProfileBtn' ritmo-build/public/app.js
          grep -Fq 'Nova senha' ritmo-build/public/app.js
          ! grep -Fq "['privacy','Privacidade'" ritmo-build/public/app.js
          grep -Fq '@simplewebauthn/server' ritmo-build/_worker.js
          grep -Fq '/api/webauthn/register/options' ritmo-build/_worker.js
          grep -Fq '/api/webauthn/auth/verify' ritmo-build/_worker.js
          grep -Fq 'turnstileToken' ritmo-build/public/app.js
          grep -Fq 'verifyTurnstile' ritmo-build/_worker.js
          grep -Fq 'webauthn_credentials' ritmo-build/schema.sql

      - name: Build
        working-directory: ritmo-build
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/styles.css
          test -s dist/_worker.js
          grep -Fq '@simplewebauthn/server' package.json

      - name: Iniciar autorização Cloudflare
        id: cfauth
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/ritmo-build/cloudflare-device-login.txt"
          PID="$GITHUB_WORKSPACE/ritmo-build/cloudflare-device-login.pid"
          rm -f "$LOG" "$PID"
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mode=device" >> "$GITHUB_OUTPUT"
          (
            unset RUNNER_TRACKING_ID
            nohup npx --yes wrangler@latest login --device --browser=false > "$LOG" 2>&1 &
            echo $! > "$PID"
          )
          for i in {1..45}; do
            if grep -q 'dash.cloudflare.com/oauth2/device' "$LOG"; then
              cat "$LOG"
              exit 0
            fi
            sleep 1
          done
          cat "$LOG"
          exit 1

      - name: Disponibilizar autorização
        if: steps.cfauth.outputs.mode == 'device'
        uses: actions/upload-artifact@v4
        with:
          name: ritmo-cloudflare-authorization-v5-secure
          path: ritmo-build/cloudflare-device-login.txt
          retention-days: 1

      - name: Aguardar autorização
        if: steps.cfauth.outputs.mode == 'device'
        shell: bash
        run: |
          set -euo pipefail
          PID="$GITHUB_WORKSPACE/ritmo-build/cloudflare-device-login.pid"
          P="$(cat "$PID")"
          for i in {1..300}; do
            if npx --yes wrangler@latest whoami --json >/tmp/whoami.json 2>/dev/null; then exit 0; fi
            if ! kill -0 "$P" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          exit 1

      - name: Descobrir conta
        id: account
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest whoami --json > /tmp/whoami.json
          ACCOUNT_ID="$(node -e "const d=require('/tmp/whoami.json');const a=d.accounts?.[0];if(!a?.id)process.exit(2);process.stdout.write(a.id)")"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Garantir projeto ritmo-br
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        shell: bash
        run: |
          set -euo pipefail
          LIST="$(npx --yes wrangler@latest pages project list 2>&1)"
          echo "$LIST"
          if echo "$LIST" | grep -Eq '(^|[[:space:]│])ritmo-br([[:space:]│]|$)'; then
            echo "Projeto ritmo-br já existe."
          else
            npx --yes wrangler@latest pages project create ritmo-br --production-branch main
          fi

      - name: Garantir KV do Ritmo
        id: kv
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest kv namespace list > /tmp/kv-list.txt
          KV_ID="$(node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('/tmp/kv-list.txt','utf8');
          let id='';
          try {
            const d=JSON.parse(s); const a=Array.isArray(d)?d:(d.result||[]);
            const x=a.find(v=>(v.title||v.name)==='ritmo-br-cache');
            id=x?.id||'';
          } catch {}
          if(!id){
            const line=s.split(/\r?\n/).find(l=>l.includes('ritmo-br-cache'))||'';
            id=(line.match(/[0-9a-f]{32}/i)||[])[0]||'';
          }
          process.stdout.write(id);
          NODE
          )"
          if [ -z "$KV_ID" ]; then
            OUT="$(npx --yes wrangler@latest kv namespace create ritmo-br-cache 2>&1)"
            echo "$OUT"
            KV_ID="$(printf '%s\n' "$OUT" | grep -Eo '[0-9a-f]{32}' | head -1 || true)"
          fi
          if [ -z "$KV_ID" ]; then
            npx --yes wrangler@latest kv namespace list > /tmp/kv-list-2.txt
            KV_ID="$(node <<'NODE'
          const fs=require('fs'); const s=fs.readFileSync('/tmp/kv-list-2.txt','utf8'); let id='';
          try { const d=JSON.parse(s); const a=Array.isArray(d)?d:(d.result||[]); const x=a.find(v=>(v.title||v.name)==='ritmo-br-cache'); id=x?.id||''; } catch {}
          if(!id){ const line=s.split(/\r?\n/).find(l=>l.includes('ritmo-br-cache'))||''; id=(line.match(/[0-9a-f]{32}/i)||[])[0]||''; }
          process.stdout.write(id);
          NODE
            )"
          fi
          test -n "$KV_ID"
          echo "kv_id=$KV_ID" >> "$GITHUB_OUTPUT"
          echo "KV ritmo-br-cache pronto."

      - name: Garantir Turnstile do Ritmo
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest turnstile widget list --json > /tmp/turnstile-list.json
          SITEKEY="$(node <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/turnstile-list.json','utf8'));
          function arr(x){ if(Array.isArray(x)) return x; if(x&&Array.isArray(x.result)) return x.result; if(x&&Array.isArray(x.widgets)) return x.widgets; return []; }
          const x=arr(d).find(w=>w?.name==='Ritmo BR'); process.stdout.write(x?.sitekey||'');
          NODE
          )"
          if [ -n "$SITEKEY" ]; then
            npx --yes wrangler@latest turnstile widget get "$SITEKEY" --json > /tmp/turnstile-widget.json
          else
            npx --yes wrangler@latest turnstile widget create "Ritmo BR" --domain ritmo-br.pages.dev --mode managed --json > /tmp/turnstile-widget.json
          fi
          node <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/turnstile-widget.json','utf8'));
          function find(o){
            if(!o||typeof o!=='object') return null;
            if(typeof o.sitekey==='string'&&typeof o.secret==='string') return o;
            for(const v of Object.values(o)){ const r=find(v); if(r) return r; }
            return null;
          }
          const w=find(d); if(!w) process.exit(2);
          fs.writeFileSync('/tmp/turnstile.sitekey',w.sitekey);
          fs.writeFileSync('/tmp/turnstile.secret',w.secret);
          NODE
          test -s /tmp/turnstile.sitekey
          test -s /tmp/turnstile.secret
          TURNSTILE_SECRET="$(cat /tmp/turnstile.secret)"
          echo "::add-mask::$TURNSTILE_SECRET"
          echo "Turnstile Ritmo BR pronto."

      - name: Configurar bindings e variáveis
        working-directory: ritmo-build
        shell: bash
        run: |
          set -euo pipefail
          SITEKEY="$(cat /tmp/turnstile.sitekey)"
          cat > wrangler.toml <<EOF
          name = "ritmo-br"
          compatibility_date = "2026-09-05"
          pages_build_output_dir = "./dist"

          [[d1_databases]]
          binding = "DB"
          database_name = "ritmo-db"
          database_id = "17baeadd-2140-4cf6-ad5b-0aa0390d1d16"

          [[kv_namespaces]]
          binding = "CACHE"
          id = "${{ steps.kv.outputs.kv_id }}"

          [vars]
          APP_NAME = "Ritmo"
          APP_URL = "https://ritmo-br.pages.dev"
          TURNSTILE_SITEKEY = "$SITEKEY"
          CBOR_NATIVE_ACCELERATION_DISABLED = "true"
          EOF

      - name: Salvar segredo Turnstile no Pages
        working-directory: ritmo-build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        shell: bash
        run: |
          set -euo pipefail
          TURNSTILE_SECRET="$(cat /tmp/turnstile.secret)"
          echo "::add-mask::$TURNSTILE_SECRET"
          printf '%s' "$TURNSTILE_SECRET" | npx --yes wrangler@latest pages secret put TURNSTILE_SECRET --project-name ritmo-br

      - name: Aplicar schema D1
        working-directory: ritmo-build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: npx --yes wrangler@latest d1 execute ritmo-db --remote --file ./schema.sql

      - name: Publicar ritmo-br
        working-directory: ritmo-build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: npx --yes wrangler@latest pages deploy dist --project-name ritmo-br --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true

      - name: Validar produção segura
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ritmo-br.pages.dev"
          HC=000; PC=000; SC=000
          for i in {1..36}; do
            HC="$(curl -sS -o /tmp/health.json -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/api/health?build=$GITHUB_SHA" || true)"
            PC="$(curl -sS -o /tmp/index.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/?build=$GITHUB_SHA" || true)"
            SC="$(curl -sS -o /tmp/security.json -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/api/security/config?build=$GITHUB_SHA" || true)"
            if [ "$HC" = "200" ] && [ "$PC" = "200" ] && [ "$SC" = "200" ] && grep -q '"ok":true' /tmp/health.json && grep -q '<title>Ritmo</title>' /tmp/index.html; then break; fi
            sleep 5
          done
          test "$HC" = "200"
          test "$PC" = "200"
          test "$SC" = "200"
          grep -q '"db":true' /tmp/health.json
          grep -q '"kv":true' /tmp/health.json
          grep -q '"turnstile":true' /tmp/health.json
          grep -q '"webauthn":true' /tmp/health.json
          grep -Eq '"turnstile_sitekey":"[^" ]+"' /tmp/security.json
          grep -q '"webauthn":true' /tmp/security.json
          grep -q '"kv":true' /tmp/security.json
          echo "Ritmo seguro validado: $BASE"
