name: Ritmo Next architecture CI

on:
  push:
    branches: [main, ritmo-next-migration]
    paths:
      - "ritmo-next/**"
      - ".github/workflows/ritmo-next-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ritmo-next-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: ritmo-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Build Vite
        run: npm run build
      - name: Paridade funcional essencial
        shell: bash
        run: |
          set -euo pipefail
          need(){ local label="$1" file="$2" text="$3"; if grep -Fq "$text" "$file"; then echo "✓ $label"; else echo "✗ $label — ausente em $file" >&2; exit 1; fi; }
          need 'Destino da entrada' src/components/FinancialSheet.tsx 'Destino da entrada'
          need 'Pagar com' src/components/FinancialSheet.tsx 'Pagar com'
          need 'Transferir para o casal' src/pages/SharingPage.tsx 'Transferir para o casal'
          need 'Haver' src/components/FinancialSheet.tsx 'Haver'
          need 'Relatório' src/pages/ReportPage.tsx 'Relatório'
          need 'Gerar PDF' src/pages/ReportPage.tsx 'Gerar PDF'
          need 'API de transferência' src/App.tsx '/api/wallet/transfers'
          need 'Login' src/api/client.ts '/api/auth/login'
          need 'Desbloqueio do aparelho' src/security/passkeys.ts '/api/webauthn'
          need 'Perfis Pessoal/Casal' src/App.tsx 'ProfileSwitcher'
          need 'Troca de perfil somente na Home' src/App.tsx "page==='home'&&<ProfileSwitcher"
          PROFILE_SWITCHERS=$(grep -Rho '<ProfileSwitcher' src --include='*.tsx' | wc -l | tr -d ' ')
          test "$PROFILE_SWITCHERS" = "1" || { echo "✗ seletor Pessoal/Casal duplicado fora da Home" >&2; exit 1; }
          if grep -Fq 'financialPages.has(page)&&<ProfileSwitcher' src/App.tsx; then echo '✗ seletor de perfil reapareceu em páginas internas' >&2; exit 1; fi
          if MATCHES="$(grep -Rin -i 'extrato' src || true)" && [ -n "$MATCHES" ]; then printf '%s\n' "$MATCHES"; echo '✗ nomenclatura antiga encontrada' >&2; exit 1; fi
          echo '✓ nomenclatura somente Relatório'
      - name: PWA e offline-first
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          grep -Fq 'display' dist/manifest.webmanifest
          grep -Fq 'indexedDB.open' src/offline/db.ts
          grep -Fq "url.pathname.startsWith('/api/')" public/sw.js
          grep -Fq 'clearFinancialCache' src/offline/db.ts
          if grep -R "setInterval" src; then echo 'setInterval proibido' >&2; exit 1; fi
          echo '✓ PWA e IndexedDB offline-first'
      - name: Orçamento de bundle
        run: |
          BYTES=$(find dist/assets -type f \( -name '*.js' -o -name '*.css' \) -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          echo "Bundle JS+CSS: ${BYTES} bytes"
          test "$BYTES" -le 450000
      - name: Política de baixo consumo
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ACTIVE_FRESH_MS' src/sync/engine.ts
          grep -Fq 'PREFETCH_FRESH_MS' src/sync/engine.ts
          grep -Fq 'MAX_MUTATION_ATTEMPTS' src/sync/engine.ts
          if grep -R -i "poll" src/sync; then echo 'polling proibido' >&2; exit 1; fi
          if grep -R "setInterval" src/sync; then echo 'setInterval proibido' >&2; exit 1; fi
          if grep -R "fetch('/api/version" src; then echo 'consulta repetitiva de versão proibida' >&2; exit 1; fi
          echo '✓ Ritmo Next aprovado sem chamadas Cloudflare no CI.'
