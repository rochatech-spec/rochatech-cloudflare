name: Ritmo V1 integrated diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ritmo-v1-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ritmo-v1-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Executar diagnóstico integrado
        id: diag
        shell: bash
        run: |
          set +e
          LOG=/tmp/ritmo-diagnostic.log
          : > "$LOG"
          (
            set -e
            rm -rf /tmp/ritmo-v1 && mkdir -p /tmp/ritmo-v1
            cat ritmo-v5/part-* > /tmp/ritmo-base.b64
            base64 -d /tmp/ritmo-base.b64 > /tmp/ritmo-base.tgz
            tar -xzf /tmp/ritmo-base.tgz -C /tmp/ritmo-v1
            python3 .github/scripts/ritmo_v6_backend.py /tmp/ritmo-v1
            python3 .github/scripts/ritmo_v6_ui.py /tmp/ritmo-v1
            python3 .github/scripts/ritmo_v7_ux_patch.py /tmp/ritmo-v1
            python3 .github/scripts/ritmo_v1_update_patch.py /tmp/ritmo-v1
            python3 .github/scripts/ritmo_v1_device_security_ux.py /tmp/ritmo-v1
            python3 .github/scripts/ritmo_v1_brand_menu_patch.py /tmp/ritmo-v1
            python3 .github/scripts/ritmo_v1_fix_sharing_runner.py
            python3 .github/scripts/ritmo_v1_sharing_patch.py /tmp/ritmo-v1
            python3 .github/scripts/ritmo_v1_ios_organization_patch.py /tmp/ritmo-v1
            node --check /tmp/ritmo-v1/public/app.js
            node --check /tmp/ritmo-v1/_worker.js
            node --check /tmp/ritmo-v1/public/sw.js
            rm -f /tmp/ritmo-schema-test.db
            sqlite3 /tmp/ritmo-schema-test.db < /tmp/ritmo-v1/schema.sql
            grep -Fq "Personalização" /tmp/ritmo-v1/public/app.js
            grep -Fq "Atalhos da barra inferior" /tmp/ritmo-v1/public/app.js
            grep -Fq "data-profile-photo" /tmp/ritmo-v1/public/app.js
            grep -Fq "Nosso Ritmo" /tmp/ritmo-v1/public/app.js
            grep -Fq "/api/shared" /tmp/ritmo-v1/_worker.js
            cd /tmp/ritmo-v1
            npm install --no-audit --no-fund
            npm run build
            test -s dist/app.js && test -s dist/styles.css && test -s dist/_worker.js
            grep -Fq "profile-ios-hero" dist/app.js
            grep -Fq "optimizeAvatar" dist/app.js
          ) >> "$LOG" 2>&1
          CODE=$?
          cd "$GITHUB_WORKSPACE"
          mkdir -p .ritmo-status
          {
            echo "commit=$GITHUB_SHA"
            echo "exit_code=$CODE"
            if [ "$CODE" -eq 0 ]; then echo "status=SUCCESS"; else echo "status=FAILURE"; fi
            echo "--- tail ---"
            tail -n 120 "$LOG"
          } > .ritmo-status/diagnostic.txt
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          cat .ritmo-status/diagnostic.txt
          exit 0
      - name: Publicar resultado do diagnóstico
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "Rocha Tech CI"
          git config user.email "actions@users.noreply.github.com"
          git add .ritmo-status/diagnostic.txt
          git commit -m "Ritmo V1: resultado do diagnóstico integrado" || exit 0
          git push origin HEAD:main
      - name: Falhar se diagnóstico falhou
        if: steps.diag.outputs.code != '0'
        run: exit 1
