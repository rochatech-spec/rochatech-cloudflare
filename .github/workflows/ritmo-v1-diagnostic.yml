name: Ritmo V1 integrated diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ritmo-v1-diagnostic.yml"
      - ".github/scripts/ritmo_v1_fix_sharing_runner.py"
      - ".github/scripts/ritmo_v1_sharing_patch.py"
      - ".github/scripts/ritmo_v1_ios_organization_patch.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ritmo-v1-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruir até Compartilhamento
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ritmo-v1 && mkdir -p /tmp/ritmo-v1
          cat ritmo-v5/part-* > /tmp/ritmo-base.b64
          base64 -d /tmp/ritmo-base.b64 > /tmp/ritmo-base.tgz
          tar -xzf /tmp/ritmo-base.tgz -C /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v6_backend.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v6_ui.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v7_ux_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_update_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_device_security_ux.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_brand_menu_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_fix_sharing_runner.py
          python3 .github/scripts/ritmo_v1_sharing_patch.py /tmp/ritmo-v1
          echo '--- FUNÇÕES DE TELA APÓS COMPARTILHAMENTO ---'
          grep -nE "function (homePage|incomePage|expensePage|debtPage|goalsPage|goalCard|morePage|sharingPage|shortcutsPage|calendarPage|settingsPage|profilePage)" /tmp/ritmo-v1/public/app.js || true
          echo '--- OCORRÊNCIAS MENU ---'
          grep -n "morePage\|sharingPage\|shortcutsPage" /tmp/ritmo-v1/public/app.js | head -n 40 || true
          echo '--- TAMANHO APP ---'
          wc -c /tmp/ritmo-v1/public/app.js
          node --check /tmp/ritmo-v1/public/app.js
      - name: Aplicar organização iOS
        run: python3 .github/scripts/ritmo_v1_ios_organization_patch.py /tmp/ritmo-v1
      - name: Validar resultado
        shell: bash
        run: |
          set -euo pipefail
          node --check /tmp/ritmo-v1/public/app.js
          node --check /tmp/ritmo-v1/_worker.js
          rm -f /tmp/ritmo-schema-test.db
          sqlite3 /tmp/ritmo-schema-test.db < /tmp/ritmo-v1/schema.sql
          grep -Fq "Personalização" /tmp/ritmo-v1/public/app.js
          grep -Fq "Atalhos da barra inferior" /tmp/ritmo-v1/public/app.js
          grep -Fq "data-profile-photo" /tmp/ritmo-v1/public/app.js
          grep -Fq "Nosso Ritmo" /tmp/ritmo-v1/public/app.js
          cd /tmp/ritmo-v1
          npm install --no-audit --no-fund
          npm run build
          grep -Fq "profile-ios-hero" dist/app.js
          grep -Fq "optimizeAvatar" dist/app.js
