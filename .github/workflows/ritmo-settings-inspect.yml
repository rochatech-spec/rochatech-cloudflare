name: Ritmo settings inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ritmo-settings-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar pacote atual
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ritmo && mkdir -p /tmp/ritmo
          cat ritmo-v5/part-* > /tmp/ritmo.b64
          base64 -d /tmp/ritmo.b64 > /tmp/ritmo.tgz
          tar -xzf /tmp/ritmo.tgz -C /tmp/ritmo
      - name: Mostrar settings backend/schema/css
        shell: bash
        run: |
          set -euo pipefail
          echo '=== USER SETTINGS SCHEMA ==='
          grep -n -E -C 8 'CREATE TABLE.*user_settings|user_settings' /tmp/ritmo/schema.sql | head -n 220 || true
          echo '=== SETTINGS ROUTES ==='
          grep -n -E -C 10 '/api/settings|user_settings|monthly_summary|reminder_days' /tmp/ritmo/_worker.js | head -n 420 || true
          echo '=== CSS HEAD/BOTTOM/CARDS ==='
          grep -n -E -C 3 'bottom|page-head|head-actions|stat-icon|row-icon|settings-list|setting-row|fab|top-mobile' /tmp/ritmo/public/styles.css | head -n 520 || true
