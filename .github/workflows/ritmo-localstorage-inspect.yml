name: Ritmo localStorage inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ritmo-localstorage-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar pacote
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ritmo && mkdir -p /tmp/ritmo
          cat ritmo-v5/part-* > /tmp/ritmo.b64
          base64 -d /tmp/ritmo.b64 > /tmp/ritmo.tgz
          tar -xzf /tmp/ritmo.tgz -C /tmp/ritmo
      - name: Auditar persistência local
        shell: bash
        run: |
          set -euo pipefail
          grep -n -E -C 3 'localStorage|sessionStorage|indexedDB|CacheStorage|caches\.' /tmp/ritmo/public/app.js | head -n 500 || true
          echo '=== SERVICE WORKER ==='
          cat /tmp/ritmo/public/sw.js || true
