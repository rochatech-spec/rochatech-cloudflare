# fresh Cloudflare device authorization
name: Ritmo V1 finance security publish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ritmo-v1-finance-security-publish.yml"
      - ".github/scripts/ritmo_v1_financial_intelligence_patch.py"
      - ".github/scripts/ritmo_v1_native_lock_patch.py"
      - ".github/scripts/ritmo_v1_native_sheet_motion_patch.py"
      - ".github/scripts/ritmo_v1_premium_lock_screen_patch.py"
      - ".github/scripts/ritmo_v1_couple_spaces_patch.py"
      - ".github/scripts/ritmo_v1_debt_av_sync_patch.py"
      - ".github/scripts/ritmo_v1_goal_strategy_patch.py"
      - ".github/scripts/ritmo_v1_native_biometric_flow_patch.py"
      - ".github/scripts/ritmo_v1_native_performance_patch.py"
      - ".github/scripts/ritmo_v1_auth_platform_cleanup_patch.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ritmo-v1-finance-security
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar processamento visual
        run: python3 -m pip install --quiet pillow
      - name: Montar Ritmo Versão 1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ritmo-v1 && mkdir -p /tmp/ritmo-v1
          cat ritmo-v5/part-* > /tmp/ritmo-base.b64
          base64 -d /tmp/ritmo-base.b64 > /tmp/ritmo-base.tgz
          tar -xzf /tmp/ritmo-base.tgz -C /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v6_backend.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v6_ui.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v7_ux_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_update_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_device_security_ux.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_brand_menu_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_fix_sharing_runner.py
          python3 .github/scripts/ritmo_v1_sharing_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_ios_organization_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_avatar_cloud_fallback.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_welcome_install_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_ios_system_polish.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_mobile_safearea_fix.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_action_sheet_icon_polish.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_install_handoff_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_theme_icons_drag_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_compact_ios_cards_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_native_resilience_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_financial_intelligence_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_native_lock_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_native_sheet_motion_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_premium_lock_screen_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_couple_spaces_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_debt_av_sync_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_goal_strategy_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_native_biometric_flow_patch.py /tmp/ritmo-v1
          python3 .github/scripts/ritmo_v1_auth_platform_cleanup_patch.py /tmp/ritmo-v1

      - name: Bateria completa do Ritmo
        working-directory: /tmp/ritmo-v1
        shell: bash
        run: |
          set -euo pipefail
          echo '1/12 Sintaxe e banco'
          node --check public/app.js
          node --check _worker.js
          node --check public/sw.js
          rm -f /tmp/ritmo-test.db
          sqlite3 /tmp/ritmo-test.db < schema.sql

          echo '2/12 Realizado x previsto'
          grep -Fq 'function incomeIsRealized' public/app.js
          grep -Fq 'balance=income-paid' public/app.js
          grep -Fq 'forecast=balance+receivable-pending' public/app.js
          grep -Fq 'A receber' public/app.js
          grep -Fq 'A pagar' public/app.js
          node - <<'NODE'
          const today='2026-09-06';
          const incomes=[{amount:1200,date:'2026-09-05'},{amount:5000,date:'2026-10-05'}];
          const expenses=[{amount:200,date:'2026-09-04',status:'pago'},{amount:400,date:'2026-09-20',status:'pendente'}];
          const income=incomes.filter(x=>x.date<=today).reduce((s,x)=>s+x.amount,0);
          const paid=expenses.filter(x=>x.status==='pago'&&x.date<=today).reduce((s,x)=>s+x.amount,0);
          const receivable=incomes.filter(x=>x.date>today).reduce((s,x)=>s+x.amount,0);
          const pending=expenses.filter(x=>!(x.status==='pago'&&x.date<=today)).reduce((s,x)=>s+x.amount,0);
          if(income-paid!==1000||income-paid+receivable-pending!==5600)throw new Error('Regra financeira falhou');
          NODE

          echo '3/12 Espaços pessoal e casal'
          grep -Fq 'function financeScopeField' public/app.js
          grep -Fq 'Este lançamento pertence a' public/app.js
          grep -Fq 'Individualidade preservada' public/app.js
          grep -Fq 'Do casal' public/app.js
          grep -Fq 'data-smart-new="expense"' public/app.js
          grep -Fq 'forcedScope' public/app.js
          grep -Fq 'Somente você verá este item.' public/app.js

          echo '4/12 Dívida e AV sincronizados'
          grep -Fq 'data-debt-av' public/app.js
          grep -Fq 'Registrar AV' public/app.js
          grep -Fq 'AV da dívida' _worker.js
          grep -Fq '(payment|credit|av)' _worker.js
          grep -Fq 'sincronizado com dívida' public/app.js
          grep -Fq 'Gerenciar na dívida' public/app.js
          grep -Fq 'DELETE FROM expenses WHERE debt_event_id' _worker.js
          grep -Fq 'DELETE FROM shared_expenses WHERE debt_event_id' _worker.js

          echo '5/12 Estratégia de metas'
          grep -Fq 'function goalStrategy' public/app.js
          grep -Fq 'Estratégia do Ritmo' public/app.js
          grep -Fq 'Calculada com seus aportes reais' public/app.js
          grep -Fq '/semana' public/app.js
          grep -Fq 'cada/mês' public/app.js
          node - <<'NODE'
          const rem=3800,avg=200,accelerated=Math.ceil((avg*1.2)/10)*10;
          if(accelerated!==240||Math.ceil(rem/accelerated)!==16)throw new Error('Estratégia de meta falhou');
          NODE

          echo '6/12 Bloqueio e sessão'
          grep -Fq '/api/auth/reverify' _worker.js
          grep -Fq "sessionStorage.getItem(k)==='1'" public/app.js
          grep -Fq 'function ritmoRenderAppCore' public/app.js
          grep -Fq 'document.hidden)clearTimeout(ritmoLockTimer)' public/app.js
          grep -Fq 'Manter conta salva neste aparelho' public/app.js
          grep -Fq 'class="secure-lock premium-lock"' public/app.js

          echo '7/12 Biometria e passkeys multiplataforma'
          grep -Fq 'Desbloqueio do aparelho' public/app.js
          grep -Fq "residentKey:'preferred'" _worker.js
          grep -Fq "transports:JSON.parse(x.transports||'[]')" _worker.js
          grep -Fq 'function ritmoDeviceBioEnabled' public/app.js
          grep -Fq 'function ritmoAuthenticateDevice' public/app.js
          grep -Fq 'navigator.credentials.get({publicKey:pk})' public/app.js
          grep -Fq 'Face ID / Touch ID' public/app.js
          grep -Fq 'Windows Hello' public/app.js
          ! grep -Fq "transports:['internal']" public/app.js
          ! grep -Fq "transports:['internal']" _worker.js
          ! grep -Fq "hints=['client-device']" public/app.js
          ! grep -Fq 'unlockBio(true)' public/app.js
          ! grep -Fq "residentKey:'discouraged'" _worker.js
          ! grep -Fq 'ritmoPrepareBioChallenge' public/app.js

          echo '8/12 Login leve e credenciais locais'
          python3 - <<'PY'
          from pathlib import Path
          s=Path('public/app.js').read_text().lower()
          bad=['localstorage.setitem(\'password','localstorage.setitem("password','localstorage.setitem(`password','ritmo:saved-password']
          if any(x in s for x in bad): raise SystemExit('Senha persistida localmente')
          assert 'ritmo:saved-account' in s
          for p in ['public/app.js','public/index.html','_worker.js']:
              if 'turnstile' in Path(p).read_text().lower(): raise SystemExit('Turnstile ainda presente em '+p)
          PY

          echo '9/12 PWA e experiência nativa'
          grep -Fq '"display": "standalone"' public/manifest.webmanifest
          grep -Fq 'viewport-fit=cover' public/index.html
          grep -Fq 'navigator.storage.persist' public/app.js
          grep -Fq 'ritmoNativeCloudRestore' public/app.js
          grep -Fq 'ritmo-sheet-open' public/styles.css
          grep -Fq 'prefers-reduced-motion:reduce' public/styles.css

          echo '10/12 Regressões de interface'
          grep -Fq 'data-shortcut-drag' public/app.js
          grep -Fq 'ritmoStatusBarSync' public/app.js
          grep -Fq 'premium-lock-inner' public/styles.css
          grep -Fq 'couple-space-grid' public/styles.css
          grep -Fq 'goal-strategy' public/styles.css
          grep -Fq 'debt-actions-three' public/styles.css

          echo '11/12 Build de produção'
          npm install --no-audit --no-fund
          npm run build
          node --check dist/app.js
          node --check dist/_worker.js
          node --check dist/sw.js
          grep -Fq 'function goalStrategy' dist/app.js
          grep -Fq 'data-debt-av' dist/app.js
          grep -Fq 'financeScopeField' dist/app.js
          grep -Fq 'ritmoAuthenticateDevice' dist/app.js
          grep -Fq "residentKey:'preferred'" dist/_worker.js
          ! grep -Fqi 'turnstile' dist/app.js
          ! grep -Fqi 'turnstile' dist/index.html
          ! grep -Fqi 'turnstile' dist/_worker.js

          echo '12/12 Artefatos essenciais'
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/styles.css
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          echo 'Bateria completa aprovada.'

      - name: Iniciar autorização Cloudflare
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/cloudflare-device-login.txt"
          PID="$GITHUB_WORKSPACE/cloudflare-device-login.pid"
          rm -f "$LOG" "$PID"
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "mode=token" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "mode=device" >> "$GITHUB_OUTPUT"
          (unset RUNNER_TRACKING_ID; nohup npx --yes wrangler@latest login --device --browser=false > "$LOG" 2>&1 & echo $! > "$PID")
          for i in {1..45}; do
            if grep -q 'dash.cloudflare.com/oauth2/device' "$LOG"; then cat "$LOG"; exit 0; fi
            sleep 1
          done
          cat "$LOG"; exit 1

      - name: Disponibilizar autorização
        if: steps.auth.outputs.mode == 'device'
        uses: actions/upload-artifact@v4
        with:
          name: ritmo-v1-finance-security-cloudflare-authorization
          path: cloudflare-device-login.txt
          retention-days: 1

      - name: Aguardar autorização
        if: steps.auth.outputs.mode == 'device'
        shell: bash
        run: |
          set -euo pipefail
          P="$(cat "$GITHUB_WORKSPACE/cloudflare-device-login.pid")"
          for i in {1..300}; do
            if npx --yes wrangler@latest whoami --json >/tmp/whoami.json 2>/dev/null; then exit 0; fi
            if ! kill -0 "$P" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          exit 1

      - name: Identificar conta
        id: account
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest whoami --json > /tmp/whoami.json
          ACCOUNT_ID="$(node -e "const d=require('/tmp/whoami.json');const a=d.accounts?.[0];if(!a?.id)process.exit(2);process.stdout.write(a.id)")"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Limpar Turnstile obsoleto do projeto
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: |
          set -euo pipefail
          LIST="$(npx --yes wrangler@latest pages secret list --project-name ritmo-br 2>&1 || true)"
          printf '%s\n' "$LIST"
          for KEY in TURNSTILE_SECRET TURNSTILE_SITEKEY; do
            if printf '%s\n' "$LIST" | grep -q "$KEY"; then
              printf 'y\n' | npx --yes wrangler@latest pages secret delete "$KEY" --project-name ritmo-br
            fi
          done
          AFTER="$(npx --yes wrangler@latest pages secret list --project-name ritmo-br 2>&1 || true)"
          if printf '%s\n' "$AFTER" | grep -Eq 'TURNSTILE_SECRET|TURNSTILE_SITEKEY'; then
            echo 'Segredo Turnstile ainda presente no projeto.' >&2
            exit 1
          fi
          echo 'Turnstile removido do projeto; D1/KV/R2 preservados.'

      - name: Publicar
        working-directory: /tmp/ritmo-v1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: npx --yes wrangler@latest pages deploy dist --project-name ritmo-br --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true

      - name: Validar produção
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://ritmo-br.pages.dev
          for i in {1..36}; do
            JS="$(curl -sS -o /tmp/app.js -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/app.js?smart=$GITHUB_SHA" || true)"
            WK="$(curl -sS -o /tmp/health.json -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/api/health?smart=$GITHUB_SHA" || true)"
            CSS="$(curl -sS -o /tmp/styles.css -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/styles.css?smart=$GITHUB_SHA" || true)"
            IDX="$(curl -sS -o /tmp/index.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/?smart=$GITHUB_SHA" || true)"
            if [ "$JS" = 200 ] && [ "$WK" = 200 ] && [ "$CSS" = 200 ] && [ "$IDX" = 200 ] && grep -Fq 'goalStrategy' /tmp/app.js && grep -Fq 'data-debt-av' /tmp/app.js && grep -Fq 'financeScopeField' /tmp/app.js && grep -Fq 'ritmoAuthenticateDevice' /tmp/app.js; then break; fi
            sleep 5
          done
          test "$JS" = 200; test "$WK" = 200; test "$CSS" = 200; test "$IDX" = 200
          grep -q '"ok":true' /tmp/health.json
          grep -Fq 'A receber' /tmp/app.js
          grep -Fq 'Estratégia do Ritmo' /tmp/app.js
          grep -Fq 'Individualidade preservada' /tmp/app.js
          grep -Fq 'Registrar AV' /tmp/app.js
          grep -Fq 'ritmoAuthenticateDevice' /tmp/app.js
          grep -Fq 'ritmoDeviceBioEnabled' /tmp/app.js
          ! grep -Fqi 'turnstile' /tmp/app.js
          ! grep -Fqi 'turnstile' /tmp/index.html
          ! grep -Fqi 'turnstile' /tmp/health.json
          grep -Fq 'couple-space-grid' /tmp/styles.css
          echo 'Ritmo V1 validado em produção.'
