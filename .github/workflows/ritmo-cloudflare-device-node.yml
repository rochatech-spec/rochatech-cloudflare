name: Ritmo Commercial • Cloudflare Device Node Deploy
# library-advanced-pwa-deploy: 2026-09-10-v1

on:
  push:
    branches: [ritmo-commercial-bootstrap, main]
    paths:
      - ".github/workflows/ritmo-cloudflare-device-node.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request:
    name: Gerar código Cloudflare
    runs-on: ubuntu-latest
    outputs:
      device_code: ${{ steps.device.outputs.device_code }}
      interval: ${{ steps.device.outputs.interval }}
      expires_in: ${{ steps.device.outputs.expires_in }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Solicitar código de dispositivo
        id: device
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          (async () => {
            const clientId = '54d11594-84e4-41aa-b438-e81b8fa78ee7';
            const scope = 'account:read user:read workers:write workers_kv:write d1:write pages:write offline_access';
            const body = new URLSearchParams({ client_id: clientId, scope });
            const res = await fetch('https://dash.cloudflare.com/oauth2/device/auth', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: body.toString(),
            });
            const text = await res.text();
            if (!res.ok) throw new Error(`Device auth HTTP ${res.status}: ${text.slice(0,300)}`);
            const d = JSON.parse(text);
            if (!d.device_code || !d.user_code || !d.verification_uri) throw new Error('Resposta de device auth incompleta');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `device_code=${d.device_code}\ninterval=${d.interval || 5}\nexpires_in=${d.expires_in || 300}\n`);
            console.log(`CLOUDFLARE_USER_CODE=${d.user_code}`);
            console.log(`CLOUDFLARE_VERIFY_URL=${d.verification_uri}`);
            if (d.verification_uri_complete) console.log(`CLOUDFLARE_DIRECT_URL=${d.verification_uri_complete}`);
            console.log(`Código válido por até ${d.expires_in || 300} segundos.`);
          })().catch((err) => { console.error(err); process.exit(1); });
          NODE

  deploy:
    name: Aguardar autorização e publicar
    needs: request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 83fb94d06af817cd5715cd691bb23997
      DEVICE_CODE: ${{ needs.request.outputs.device_code }}
      POLL_INTERVAL: ${{ needs.request.outputs.interval }}
      EXPIRES_IN: ${{ needs.request.outputs.expires_in }}
    defaults:
      run:
        working-directory: ritmo-commercial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Trocar autorização por token OAuth
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          (async () => {
            const clientId = '54d11594-84e4-41aa-b438-e81b8fa78ee7';
            const deviceCode = process.env.DEVICE_CODE;
            let interval = Number(process.env.POLL_INTERVAL || 5);
            const deadline = Date.now() + Number(process.env.EXPIRES_IN || 300) * 1000;
            while (Date.now() < deadline) {
              const body = new URLSearchParams({
                grant_type: 'urn:ietf:params:oauth:grant-type:device_code',
                device_code: deviceCode,
                client_id: clientId,
              });
              const res = await fetch('https://dash.cloudflare.com/oauth2/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body.toString(),
              });
              const text = await res.text();
              let d = {};
              try { d = JSON.parse(text); } catch {}
              if (d.access_token) {
                console.log(`::add-mask::${d.access_token}`);
                fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_API_TOKEN=${d.access_token}\n`);
                console.log('Cloudflare autorizado com sucesso.');
                return;
              }
              if (d.error === 'access_denied' || d.error === 'expired_token') throw new Error(d.error);
              if (d.error === 'slow_down') interval += 5;
              await new Promise(r => setTimeout(r, interval * 1000));
            }
            throw new Error('Autorização Cloudflare expirou');
          })().catch((err) => { console.error(err); process.exit(1); });
          NODE

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Confirmar conta Cloudflare
        run: npx wrangler whoami --json > /tmp/whoami.json

      - name: Criar ou reutilizar D1 e KVs
        run: |
          set -euo pipefail
          npx wrangler d1 list --json --config wrangler.bootstrap.jsonc > /tmp/d1.json
          DB_ID="$(node -e "const a=require('/tmp/d1.json');const d=a.find(x=>x.name==='ritmo-commercial-db');if(d)process.stdout.write(d.uuid||d.id||'')")"
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create ritmo-commercial-db --config wrangler.bootstrap.jsonc > /tmp/d1-create.txt 2>&1
            DB_ID="$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/d1-create.txt | head -1)"
          fi
          test -n "$DB_ID"
          npx wrangler kv namespace list --config wrangler.bootstrap.jsonc > /tmp/kv.json
          KV_ID="$(node -e "const fs=require('fs');let s=fs.readFileSync('/tmp/kv.json','utf8');let a;try{a=JSON.parse(s)}catch{const p=s.indexOf('['),q=s.lastIndexOf(']');a=JSON.parse(s.slice(p,q+1))}const d=a.find(x=>x.title==='ritmo-commercial-session'||x.name==='ritmo-commercial-session');if(d)process.stdout.write(d.id||'')")"
          if [ -z "$KV_ID" ]; then
            npx wrangler kv namespace create ritmo-commercial-session --config wrangler.bootstrap.jsonc > /tmp/kv-create.txt 2>&1
            KV_ID="$(grep -Eo '[0-9a-f]{32}' /tmp/kv-create.txt | head -1)"
          fi
          test -n "$KV_ID"
          FILES_KV_ID="$(node -e "const fs=require('fs');let s=fs.readFileSync('/tmp/kv.json','utf8');let a;try{a=JSON.parse(s)}catch{const p=s.indexOf('['),q=s.lastIndexOf(']');a=JSON.parse(s.slice(p,q+1))}const d=a.find(x=>x.title==='ritmo-commercial-files'||x.name==='ritmo-commercial-files');if(d)process.stdout.write(d.id||'')")"
          if [ -z "$FILES_KV_ID" ]; then
            npx wrangler kv namespace create ritmo-commercial-files --config wrangler.bootstrap.jsonc > /tmp/files-kv-create.txt 2>&1
            FILES_KV_ID="$(grep -Eo '[0-9a-f]{32}' /tmp/files-kv-create.txt | head -1)"
          fi
          test -n "$FILES_KV_ID"
          node - "$DB_ID" "$KV_ID" "$FILES_KV_ID" <<'NODE'
          const fs=require('fs');
          const [db,kv,filesKv]=process.argv.slice(2);
          fs.writeFileSync('wrangler.deploy.jsonc',fs.readFileSync('wrangler.jsonc','utf8').replace('__D1_DATABASE_ID__',db).replace('__KV_NAMESPACE_ID__',kv).replace('__FILES_KV_NAMESPACE_ID__',filesKv));
          NODE
          npx wrangler d1 execute ritmo-commercial-db --remote --command="ALTER TABLE transactions ADD COLUMN status TEXT NOT NULL DEFAULT 'posted' CHECK(status IN ('pending','posted'))" --config wrangler.deploy.jsonc || true
          npx wrangler d1 execute ritmo-commercial-db --remote --command="ALTER TABLE transactions ADD COLUMN posted_at TEXT" --config wrangler.deploy.jsonc || true
          npx wrangler d1 execute ritmo-commercial-db --remote --file=./schema.sql --config wrangler.deploy.jsonc

      - name: Garantir Pages e segredos
        run: |
          set -euo pipefail
          if ! npx wrangler pages deployment list --project-name ritmo-commercial --config wrangler.bootstrap.jsonc >/tmp/pages-list.txt 2>&1; then
            npx wrangler pages project create ritmo-commercial --production-branch main --config wrangler.bootstrap.jsonc
          fi
          npx wrangler pages secret list --project-name ritmo-commercial --config wrangler.bootstrap.jsonc > /tmp/secrets.txt
          if ! grep -q 'RECOVERY_PEPPER' /tmp/secrets.txt; then
            openssl rand -hex 48 | npx wrangler pages secret put RECOVERY_PEPPER --project-name ritmo-commercial --config wrangler.bootstrap.jsonc
          fi
          HAS_PUBLIC=0; HAS_PRIVATE=0
          grep -q 'VAPID_PUBLIC_KEY' /tmp/secrets.txt && HAS_PUBLIC=1 || true
          grep -q 'VAPID_PRIVATE_KEY' /tmp/secrets.txt && HAS_PRIVATE=1 || true
          if [ "$HAS_PUBLIC" != "$HAS_PRIVATE" ]; then exit 3; fi
          if [ "$HAS_PUBLIC" = 0 ]; then
            node scripts/generate-vapid.mjs > /tmp/vapid.env
            set -a; . /tmp/vapid.env; set +a
            printf '%s' "$VAPID_PUBLIC_KEY" | npx wrangler pages secret put VAPID_PUBLIC_KEY --project-name ritmo-commercial --config wrangler.bootstrap.jsonc
            printf '%s' "$VAPID_PRIVATE_KEY" | npx wrangler pages secret put VAPID_PRIVATE_KEY --project-name ritmo-commercial --config wrangler.bootstrap.jsonc
          fi

      - name: Preparar PWA avançado da Biblioteca
        run: |
          set -euo pipefail
          rm -rf advanced-dist /tmp/ritmo-pwa-advanced
          mkdir -p advanced-dist /tmp/ritmo-pwa-advanced
          unzip -q deploy/Ritmo-PWA-Avancado.zip -d /tmp/ritmo-pwa-advanced
          SRC="$(find /tmp/ritmo-pwa-advanced -type f -name index.html -printf '%h\n' | head -1)"
          test -n "$SRC"
          cp -a "$SRC"/. advanced-dist/
          test -s advanced-dist/index.html
          test -s advanced-dist/manifest.webmanifest
          test -s advanced-dist/sw.js
          grep -q 'Ritmo' advanced-dist/index.html
          grep -q '"standalone"' advanced-dist/manifest.webmanifest

      - name: Publicar PWA avançado + Functions
        run: |
          set -euo pipefail
          cp wrangler.deploy.jsonc wrangler.jsonc
          npx wrangler pages deploy advanced-dist --project-name ritmo-commercial --branch main --commit-hash "$GITHUB_SHA"


      - name: Validar produção
        run: |
          set -euo pipefail
          BASE='https://ritmo-commercial.pages.dev'
          READY=0
          for i in {1..30}; do
            HLT="$(curl -sS -o /tmp/health.json -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/api/health?release=$GITHUB_SHA" || true)"
            IDX="$(curl -sS -o /tmp/index.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/?release=$GITHUB_SHA" || true)"
            MAN="$(curl -sS -o /tmp/manifest.webmanifest -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/manifest.webmanifest?release=$GITHUB_SHA" || true)"
            SW="$(curl -sS -o /tmp/sw.js -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/sw.js?release=$GITHUB_SHA" || true)"
            if [ "$HLT" = "200" ] && [ "$IDX" = "200" ] && [ "$MAN" = "200" ] && [ "$SW" = "200" ] && grep -q '"ok":true' /tmp/health.json && grep -q '"filesKv":true' /tmp/health.json && grep -q 'standalone' /tmp/manifest.webmanifest && test -s /tmp/sw.js; then
              READY=1
              break
            fi
            sleep 4
          done
          test "$READY" = "1"


# fab-black-deploy-auth: 2026-09-10-v6
