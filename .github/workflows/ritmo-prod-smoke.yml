name: Ritmo Commercial • Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ritmo-prod-smoke.yml"
      - "ritmo-commercial/src/**"
      - "ritmo-commercial/wrangler.jsonc"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Health
        run: |
          set -euo pipefail
          curl -fsS https://ritmo-commercial.pages.dev/api/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json

      - name: Validar infraestrutura via registro inválido
        run: |
          set -euo pipefail
          STATUS="$(curl -sS -o /tmp/register.json -w '%{http_code}' \
            -X POST https://ritmo-commercial.pages.dev/api/auth/register \
            -H 'Content-Type: application/json' \
            --data '{"displayName":"x","username":"x","password":"12345678"}')"
          cat /tmp/register.json
          test "$STATUS" = "400"
          grep -Eq '"code":"(INVALID_DISPLAY_NAME|INVALID_USERNAME)"' /tmp/register.json


      - name: PWA
        run: |
          set -euo pipefail
          curl -fsS https://ritmo-commercial.pages.dev/ -o /tmp/index.html
          grep -q 'manifest.webmanifest' /tmp/index.html
          curl -fsS https://ritmo-commercial.pages.dev/manifest.webmanifest -o /tmp/manifest.webmanifest
          grep -q '"name"' /tmp/manifest.webmanifest
          curl -fsS https://ritmo-commercial.pages.dev/sw.js -o /tmp/sw.js
          test -s /tmp/sw.js


      - name: Validar paridade visual
        run: |
          set -euo pipefail
          BASE='https://ritmo-commercial.pages.dev'
          curl -fsS -H 'Cache-Control: no-cache' "$BASE/?parity=$GITHUB_SHA" -o /tmp/index.html
          CSS_PATH="$(grep -oE 'href="/assets/[^"]+\.css"' /tmp/index.html | head -1 | cut -d'"' -f2)"
          test -n "$CSS_PATH"
          curl -fsS -H 'Cache-Control: no-cache' "$BASE$CSS_PATH?parity=$GITHUB_SHA" -o /tmp/app.css
          grep -Eiq -- '--bg:#070a0f|--bg:#070A0F' /tmp/app.css
          grep -Eq -- 'max-width:680px' /tmp/app.css
          grep -Eiq -- '#8fbfff|#8FBFFF' /tmp/app.css
