name: CONTROL final production
on:
  push:
    branches: [main]
    paths: ['control/**','.github/workflows/control-final-production.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: control-final-production
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control/package.json
      - name: Install
        working-directory: control
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: control
        run: npm run build
      - name: Validate build
        working-directory: control
        run: |
          test -s dist/index.html
          test -s dist/manifest.json
          test -s dist/sw.js
          test -s dist/control-symbol-green.svg
      - name: Package build artifact
        uses: actions/upload-artifact@v4
        with:
          name: control-production-dist
          path: control/dist
          retention-days: 1
