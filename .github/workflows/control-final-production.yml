name: CONTROL final production
on:
  push:
    branches: [main]
    paths: ['control/**','.github/workflows/control-final-production.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: control-final-production
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control/package.json
      - name: Install
        working-directory: control
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: control
        run: npm run build
      - name: Prepare deployment tree
        shell: bash
        run: |
          rm -rf deploy/control
          mkdir -p deploy/control
          cp -R control/dist/. deploy/control/
      - name: Build Pages Functions bundle
        working-directory: control
        run: npx --yes wrangler@latest pages functions build functions --outfile ../deploy/control/_worker.js --project-directory . --output-routes-path ../deploy/control/_routes.json
      - name: Validate build
        working-directory: control
        run: |
          test -s dist/index.html
          test -s dist/manifest.json
          test -s dist/sw.js
          test -s dist/control-symbol-green.svg
          test -s ../deploy/control/_worker.js
      - name: Publish build into deployment tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/control
          git commit -m "build(control): publish production assets" || exit 0
          git push origin HEAD:main
      - name: Package deployment tree
        uses: actions/upload-artifact@v4
        with:
          name: control-production-deployment
          path: deploy/control
          retention-days: 1
