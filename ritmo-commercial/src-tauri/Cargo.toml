[package]
name = "ritmo"
version = "1.0.1"
description = "Ritmo - Gestão Financeira"
authors = ["RochaTech"]
edition = "2021"

[lib]
name = "ritmo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-http = "2.5.9"
tauri-plugin-notification = "2.3.3"
tauri-plugin-stronghold = "2.3.1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2.3.2"
tauri-plugin-geolocation = "2.3.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev.package.scrypt]
opt-level = 3
